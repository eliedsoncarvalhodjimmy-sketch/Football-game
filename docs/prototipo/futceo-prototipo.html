<title>FutCEO Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Disposição: barra lateral (tablet) / barra inferior (telemóvel) + área de cartões; números grandes condensados; acento = cor do clube. */
:root {
  --fundo: #0b0d10;
  --cartao: #16191e;
  --cartao-2: #1d2128;
  --linha: #2a2f38;
  --texto: #e8eaee;
  --suave: #9097a3;
  --fraco: #5f6672;
  --acento: #d63a3a;
  --acento-2: #f1f1f1;
  --bom: #3fb67a;
  --aviso: #e2a33a;
  --mau: #e0565b;
  --info: #5a9be0;
  --c-liga: #e0565b; --c-taca: #9aa1ab; --c-ucl: #4a86e8; --c-uel: #f2b632; --c-uecl: #3fb67a; --c-pausa: #d9c49a;
  --f-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-texto: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-dados: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  --raio: 12px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--fundo); color: var(--texto); font-family: var(--f-texto); font-size: 14px; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
.lateral { background: #0f1216; border-right: 1px solid var(--linha); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; overflow-y: auto; }
.marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.marca b { font-family: var(--f-num); font-size: 24px; letter-spacing: .5px; }
.marca small { display: block; color: var(--suave); font-size: 11px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--suave); text-decoration: none; font-weight: 500; }
.nav:hover { background: var(--cartao); color: var(--texto); }
.nav.activo { background: var(--cartao-2); color: var(--texto); box-shadow: inset 3px 0 0 var(--acento); }
.nav svg { width: 18px; height: 18px; flex: none; }

.principal { overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; min-width: 0; }
.topo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px; }
.topo h1 { font-family: var(--f-num); font-weight: 600; font-size: 30px; margin: 0; letter-spacing: .3px; text-wrap: balance; }
.topo .sub { color: var(--suave); }
.topo .direita { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--cartao-2); color: var(--suave); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.bom { color: var(--bom); } .chip.aviso { color: var(--aviso); } .chip.mau { color: var(--mau); } .chip.info { color: var(--info); }
.chip .pt { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.btn { border: 1px solid var(--linha); background: var(--cartao-2); padding: 8px 14px; border-radius: 10px; font-weight: 600; min-height: 40px; }
.btn.prim { background: var(--acento); border-color: var(--acento); color: var(--acento-2); }
.btn:hover { border-color: var(--suave); }

.grelha { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.c { background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; min-width: 0; }
.c h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--suave); margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.c h2 .acao { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--acento); font-weight: 600; cursor: pointer; }
.s9 { grid-column: span 9; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.num { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.grande { font-size: 40px; line-height: 1; }
.medio { font-size: 26px; line-height: 1; }

.muted { color: var(--suave); }
.linha-kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--linha); }
.linha-kv:last-child { border-bottom: 0; }

.escudo { width: 34px; height: 38px; flex: none; }
.forma { display: inline-flex; gap: 4px; }
.forma i { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; color: #0b0d10; }
.forma .V { background: var(--bom); } .forma .E { background: #8a919c; } .forma .D { background: var(--mau); }

.proximo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.tab-wrap { overflow-x: auto; }

.ovr.qa { color: #7fe0a5; } .ovr.qb { color: #c9e27a; } .ovr.qc { color: #e8c46a; } .ovr.qd { color: #e69a6a; }
.intervalo { font-family: var(--f-dados); font-size: 12px; color: var(--aviso); }
.barra { height: 6px; border-radius: 3px; background: var(--cartao-2); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--acento); }
.zona { width: 3px; padding: 0; }
.zona.ucl { background: var(--info); } .zona.uel { background: var(--aviso); } .zona.desc { background: var(--mau); }

.filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filtros input, .filtros select { background: var(--cartao-2); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 12px; min-height: 40px; }

.jogador-topo { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }

.estrelas { color: var(--aviso); letter-spacing: 2px; font-size: 15px; }

.atrib .v { font-family: var(--f-num); font-size: 18px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

.papeis { display: grid; gap: 8px; }

.campo { position: relative; aspect-ratio: 68/100; max-width: 420px; width: 100%; margin: 0 auto; border-radius: 10px; overflow: hidden;
  background: repeating-linear-gradient(0deg, #1f5a35 0 9%, #23633b 9% 18%); border: 2px solid #2e7a4a; }

.janela { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--aviso) 14%, var(--cartao)); border: 1px solid color-mix(in srgb, var(--aviso) 45%, transparent); }

.bm-topo { position: absolute; left: 16px; top: 12px; z-index: 1; }

.bm-contagem { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 22px; border-radius: 14px; background: rgba(11,13,16,.62); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,.12); text-align: center; }

@media (max-width: 760px) { .banner-mercado { aspect-ratio: 588/330; } .bm-dias { font-size: 42px; } .bm-topo h1 { font-size: 24px; } .bm-topo span { display: none; } }
.barra-topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0 14px; margin-bottom: 14px; border-bottom: 1px solid var(--linha); }
.data { display: flex; flex-direction: column; line-height: 1.15; }

.data span { color: var(--suave); font-size: 12px; }
.icone-btn { position: relative; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--linha); background: var(--cartao-2); display: grid; place-items: center; }

.negociacao { padding: 12px; }
.sel-comp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-bottom: 12px; }
.sel-am { min-width: 0; position: relative; display: flex; align-items: center; gap: 8px; background: #f2c230; color: #111; border-radius: 8px; padding: 0 12px; min-height: 46px; font-weight: 600; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.sel-am select { min-width: 0; text-overflow: ellipsis; appearance: none; -webkit-appearance: none; background: transparent; border: 0; color: #111; font: inherit; flex: 1; min-height: 44px; padding-right: 22px; cursor: pointer; }

.sel-am .ci, .tl-zi .ci { flex: none; width: 22px; height: 22px; border-radius: 5px; display: inline-grid; place-items: center; color: #0b0d10; } .sel-am .ci svg, .tl-zi .ci svg { width: 14px; height: 14px; }
.tl-zi .ci { width: 19px; height: 19px; } .tl-zi .ci svg { width: 12px; height: 12px; }

// Preço do bilhete (protótipo): procura com elasticidade; a satisfação reage a preços acima do de referência.
let precoBilhete = 24;
function efeitoBilhete(p) {
  const lugares = 32500, ref = 24;
  const ocup = Math.max(35, Math.min(99, Math.round(86 * Math.pow(ref / p, 0.55))));
  const assist = Math.round((lugares * ocup) / 100 / 50) * 50;
  const receita = Math.round(assist * p * 0.96);
  const satisf = Math.max(5, Math.min(95, Math.round(68 - (p - ref) * 1.4)));
  return { ocup, assist, receita, satisf };
}

preço.","efeitos":{"AD":-1,"EQ":-1,"DN":1}},{"letra":"C","tom":"evasiva","texto":"Não comento rumores. Quando houver novidades, comunicamos.","efeitos":{"IM":-1}}],"variaveis":["jogador","adversario"]},{"id":"IMP-026","titulo":"Contratação cara","seccao":"Mercado e transferências","quando":"contratação acima de 20% do orçamento de transferências","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"{valor} milhões por {jogador}. Não é um valor excessivo?","respostas":[{"letra":"A","tom":"confiante","texto":"Não. É um investimento no futuro. Se olhar para a qualidade e para a idade, é um negócio que se paga.","efeitos":{"AD":1,"DN":1,"EQ":1}},{"letra":"B","tom":"defensiva","texto":"O mercado está inflacionado, mas só se contrata quem se quer. O {jogador} era a prioridade.","efeitos":{}},{"letra":"C","tom":"provocadora","texto":"Se acha caro, venha negociar no meu lugar.","efeitos":{"IM":-1,"EQ":1}}],"variaveis":["valor","jogador"]},{"id":"IMP-027","titulo":"Falta de reforços","seccao":"Mercado e transferências","quando":"última semana da janela e orçamento de transferências por usar, ou posição sem cobertura","modo":"AMBOS","jornalista":"blogue de adeptos","tipoJornalista":"blogue","pergunta":"A janela fecha e o plantel continua curto na posição de {posicao}. Os adeptos sentem-se enganados?","respostas":[{"letra":"A","tom":"honesta","texto":"Entendo a frustração. Tentámos, mas o mercado não ajudou. Vamos confiar nos que cá estão.","efeitos":{"AD":-1,"IM":1}},{"letra":"B","tom":"compromisso","texto":"Estamos a trabalhar até ao último minuto. Pode ainda haver surpresas.","efeitos":{"AD":1},"promessa":"reforço até ao fecho da janela"},{"letra":"C","tom":"ofensiva","texto":"Os adeptos têm direito de opinar, mas quem gere o clube sou eu.","efeitos":{"AD":-2,"DN":1}}],"variaveis":["posicao"]},{"id":"IMP-028","titulo":"Venda de um ídolo","seccao":"Mercado e transferências","quando":"venda do jogador mais querido (capitão ou ídolo)","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"Vendeu o {jogador}, símbolo do clube. Traiu os adeptos?","respostas":[{"letra":"A","tom":"justificando","texto":"Foi uma decisão difícil, mas necessária para a sustentabilidade do clube. Os adeptos vão perceber.","efeitos":{"AD":-1,"DN":2}},{"letra":"B","tom":"emocional","texto":"Foi doloroso. O {jogador} sai com a nossa gratidão eterna, e a porta está sempre aberta.","efeitos":{"AD":1,"DN":1,"BL":1}},{"letra":"C","tom":"firme","texto":"Não tomo decisões para agradar. Tomo-as pelo que é melhor para o clube.","efeitos":{"AD":-2,"DN":1,"IM":-1}}],"variaveis":["jogador"]},{"id":"IMP-029","titulo":"Último dia da janela","seccao":"Mercado e transferências","quando":"último dia da janela","modo":"AMBOS","jornalista":"imprensa desportiva","tipoJornalista":"desportiva","pergunta":"Estamos nas últimas horas. Há algum negócio na calha?","respostas":[{"letra":"A","tom":"misteriosa","texto":"Há conversas, mas nada garantido. Vamos ver até ao último minuto.","efeitos":{"AD":1,"IM":1}},{"letra":"B","tom":"directa","texto":"Não. O plantel está fechado, e confio nele.","efeitos":{"EQ":1,"TR":1}},{"letra":"C","tom":"provocadora","texto":"Os adversários que estejam atentos. Podemos fazer barulho.","efeitos":{"AD":1}}],"variaveis":[]},{"id":"IMP-030","titulo":"Jogador livre","seccao":"Mercado e transferências","quando":"contratação de um jogador livre (sem custo de transferência) ou jogador veterano","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"Contratou um jogador aos {idade} anos. É uma aposta de risco?","respostas":[{"letra":"A","tom":"confiante","texto":"A experiência é valiosa, e o jogador tem muito para dar. Não é risco, é equilíbrio.","efeitos":{"AD":1,"BL":1,"TR":1}},{"letra":"B","tom":"cuidadosa","texto":"É uma opção com baixo custo e potencial alto. Se não correr bem, o prejuízo é pequeno.","efeitos":{"DN":1}},{"letra":"C","tom":"irónica","texto":"A idade é só um número, e os números não correm. Os jogadores sim.","efeitos":{"IM":1,"AD":1}}],"variaveis":["idade"]},{"id":"IMP-031","titulo":"Voto de confiança","seccao":"Treinador","quando":"pressão sobre o treinador (3 jogos sem vencer e rumores de despedimento)","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"Garante que o {treinador} continua?","respostas":[{"letra":"A","tom":"garantia","texto":"Garanto. Tem a nossa confiança total.","efeitos":{"TR":2,"EQ":1,"AD":-1},"promessa":"manter o treinador; se despedir nos próximos 30 dias: MENTIRA, DN −2, IM −2, BL −1","mentira":"se despedir nos próximos 30 dias: MENTIRA, DN −2, IM −2, BL −1"},{"letra":"B","tom":"prudente","texto":"Não faço garantias. Avaliamos o trabalho em cada momento.","efeitos":{"TR":-1,"EQ":-1,"IM":1}},{"letra":"C","tom":"firme","texto":"Ninguém tem a vida garantida no futebol. Nem ele, nem eu.","efeitos":{"TR":-1,"DN":1}}],"variaveis":["treinador"]},{"id":"IMP-032","titulo":"Despedimento do treinador","seccao":"Treinador","quando":"despedimento do treinador","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"Despediu o {treinador}. Como justifica a decisão?","respostas":[{"letra":"A","tom":"respeitosa","texto":"É uma decisão difícil. Agradeço-lhe o trabalho, mas era preciso mudar o rumo.","efeitos":{"IM":1,"TR":1},"notas":"(reputação junto de outros treinadores)"},{"letra":"B","tom":"directa","texto":"Os resultados falaram. O clube precisa de resultados, e foi essa a razão.","efeitos":{"AD":1,"DN":1,"TR":-1},"notas":"(reputação)"},{"letra":"C","tom":"reservada","texto":"Prefiro não entrar em pormenores. É uma decisão interna.","efeitos":{"IM":-1}}],"variaveis":["treinador"]},{"id":"IMP-033","titulo":"Apresentação do novo treinador","seccao":"Treinador","quando":"contratação de novo treinador","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"Porquê o {treinador}? Que perfil procuravam?","respostas":[{"letra":"A","tom":"filosofia","texto":"Procurávamos um treinador que se alinhasse com a nossa filosofia, e ele encaixa perfeitamente.","efeitos":{"AD":1,"DN":1,"TR":1}},{"letra":"B","tom":"resultados","texto":"Procurávamos resultados. E os resultados do {treinador} falam por si.","efeitos":{"AD":1,"IM":1}},{"letra":"C","tom":"honesta","texto":"Era a opção possível dentro do nosso orçamento, e estamos confiantes.","efeitos":{"AD":-1,"TR":-1,"DN":1}}],"variaveis":["treinador"]},{"id":"IMP-034","titulo":"Conflito de filosofia","seccao":"Treinador","quando":"filosofia do clube (ex.: jovens) contraria o estilo do treinador","modo":"AMBOS","jornalista":"imprensa desportiva","tipoJornalista":"desportiva","pergunta":"Corre que o treinador não quer apostar nos jovens, ao contrário do que o clube defende. Há tensão?","respostas":[{"letra":"A","tom":"negar","texto":"Nenhuma. Estamos todos alinhados.","efeitos":{"TR":1,"IM":-1},"mentira":"MENTIRA se a tensão for pública","notas":"MENTIRA se a tensão for pública"},{"letra":"B","tom":"reconhecer","texto":"Há debate saudável. Mas o rumo é do clube, e ele vai cumpri-lo.","efeitos":{"TR":-1,"DN":1,"AD":1}},{"letra":"C","tom":"dividir","texto":"Discordamos em algumas coisas, mas respeitamo-nos. Vamos chegar a um meio-termo.","efeitos":{"IM":1}}],"variaveis":[]},{"id":"IMP-035","titulo":"Renovação do treinador","seccao":"Treinador","quando":"treinador com bons resultados e contrato a terminar","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"O contrato do {treinador} acaba no fim da época. Vão renovar?","respostas":[{"letra":"A","tom":"comprometida","texto":"Quero renovar e já estamos em conversas. É uma peça fundamental.","efeitos":{"TR":2,"AD":1,"EQ":1}},{"letra":"B","tom":"cautelosa","texto":"Há tempo para tudo. Primeiro, concentração na época.","efeitos":{}},{"letra":"C","tom":"negociadora","texto":"Quem tem sucesso aumenta o seu preço. Veremos o que o clube pode oferecer.","efeitos":{"TR":-1,"DN":1}}],"variaveis":["treinador"]},{"id":"IMP-036","titulo":"Dívida elevada","seccao":"Finanças, dono e fair play","quando":"dívida acima de um limiar (config)","modo":"AMBOS","jornalista":"imprensa económica","tipoJornalista":"economica","pergunta":"A dívida do clube cresceu. Qual é o plano para a reduzir?","respostas":[{"letra":"A","tom":"transparente","texto":"Temos um plano de amortização e vamos publicar os números. A dívida é gerível.","efeitos":{"AD":1,"DN":1,"IM":1},"promessa":"reduzir a dívida"},{"letra":"B","tom":"minimizando","texto":"A dívida está dentro do normal para um clube do nosso tamanho. Não há motivo para alarme.","efeitos":{"IM":-1},"mentira":"MENTIRA se o estado financeiro for \"crise\"","notas":"MENTIRA se o estado financeiro for \"crise\""},{"letra":"C","tom":"ofensiva","texto":"A dívida é consequência de más gestões passadas. Estou a resolver o que me deixaram.","efeitos":{"DN":-1,"AD":1},"notas":"(se o dono anterior era impopular)"}],"variaveis":[]},{"id":"IMP-037","titulo":"Sanção de fair play","seccao":"Finanças, dono e fair play","quando":"o clube é sancionado por fair play financeiro","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"O clube foi sancionado por violar o fair play. Como é que isto aconteceu?","respostas":[{"letra":"A","tom":"assumindo","texto":"Assumimos o erro e vamos cumprir a sanção. Já ajustámos a política salarial.","efeitos":{"DN":1,"IM":1}},{"letra":"B","tom":"contestando","texto":"Discordamos da leitura das regras e vamos recorrer.","efeitos":{"AD":1,"IM":-1}},{"letra":"C","tom":"relativizando","texto":"Todos os clubes grandes são multados. É o preço de competir.","efeitos":{"AD":1,"DN":-1,"IM":-1}}],"variaveis":[]},{"id":"IMP-038","titulo":"Injecção de capital do dono","seccao":"Finanças, dono e fair play","quando":"o dono injectou capital ou emprestou dinheiro ao clube","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"O dono voltou a pôr dinheiro no clube. É sustentável depender dele?","respostas":[{"letra":"A","tom":"agradecida","texto":"O dono acredita no projecto, e é graças a ele que temos condições. Mas queremos ser autossustentáveis.","efeitos":{"DN":2,"AD":1}},{"letra":"B","tom":"realista","texto":"Não é o ideal. Estamos a trabalhar para equilibrar receitas e despesas.","efeitos":{"DN":-1,"IM":1}},{"letra":"C","tom":"evasiva","texto":"Não comento negócios entre accionistas.","efeitos":{"IM":-1}}],"variaveis":[]},{"id":"IMP-039","titulo":"Rumores de venda do clube","seccao":"Finanças, dono e fair play","quando":"modo DONO com satisfação dos adeptos baixa (crise) ou investidor interessado","modo":"DONO","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"Corre que investidores estão interessados em comprar o clube. Está disposto a vender?","respostas":[{"letra":"A","tom":"firme","texto":"O clube não está à venda. Quero continuar o projecto.","efeitos":{"AD":2,"DN":-1},"promessa":"não vender nesta época; se vender: MENTIRA, AD −3","mentira":"se vender: MENTIRA, AD −3"},{"letra":"B","tom":"aberta","texto":"Se aparecer uma proposta boa para o clube, eu ouço. Mas não vendo por vender.","efeitos":{"IM":1}},{"letra":"C","tom":"ambígua","texto":"Neste momento não há nada. O futuro logo se vê.","efeitos":{"AD":-1}}],"variaveis":[]},{"id":"IMP-040","titulo":"Patrocinador a sair","seccao":"Finanças, dono e fair play","quando":"patrocinador principal rescinde ou não renova","modo":"AMBOS","jornalista":"imprensa económica","tipoJornalista":"economica","pergunta":"O principal patrocinador abandona o clube. Isso é um sinal de crise?","respostas":[{"letra":"A","tom":"calma","texto":"Não. Há muito interesse de outras marcas, e vamos encontrar uma solução.","efeitos":{"DN":1,"IM":1}},{"letra":"B","tom":"honesta","texto":"É um golpe, não nego. Mas o clube é maior do que um patrocinador.","efeitos":{"AD":1,"IM":1}},{"letra":"C","tom":"recriminadora","texto":"Quem sai agora não merece voltar. Os adeptos sabem quem esteve ao nosso lado.","efeitos":{"AD":1,"IM":-1}}],"variaveis":[]},{"id":"IMP-041","titulo":"Resultados financeiros anuais","seccao":"Finanças, dono e fair play","quando":"fecho do ano financeiro","modo":"AMBOS","jornalista":"imprensa económica","tipoJornalista":"economica","pergunta":"As contas anuais saíram. {clube} teve {lucro_ou_prejuizo}. Como as analisa?","respostas":[{"letra":"A","tom":"satisfeita","texto":"Estamos no caminho certo. Os resultados reflectem a disciplina da gestão.","efeitos":{"DN":1,"IM":1}},{"letra":"B","tom":"autocrítica","texto":"Podíamos ter feito melhor, e vamos corrigir. A sustentabilidade é uma prioridade.","efeitos":{"DN":1,"AD":1}},{"letra":"C","tom":"distraída","texto":"As contas são só um instrumento. O que conta é o que acontece em campo.","efeitos":{"IM":-1,"DN":-1}}],"variaveis":["clube","lucro_ou_prejuizo"]},{"id":"IMP-042","titulo":"Lesão grave de uma estrela","seccao":"Jogadores, balneário e academia","quando":"lesão grave (acima de 3 meses) de um titular importante","modo":"AMBOS","jornalista":"imprensa desportiva","tipoJornalista":"desportiva","pergunta":"A lesão do {jogador} é um golpe. Como vai compensar a ausência?","respostas":[{"letra":"A","tom":"confiante","texto":"Temos um grupo forte, e outros vão assumir esse papel. Vamos suportar a ausência.","efeitos":{"EQ":1,"BL":1}},{"letra":"B","tom":"realista","texto":"É uma perda enorme, e não vamos encontrar um substituto igual. Vamos olhar para o mercado.","efeitos":{"IM":1}},{"letra":"C","tom":"solidária","texto":"O {jogador} vai ter todo o apoio do clube durante a recuperação. Está em primeiro lugar.","efeitos":{"EQ":1,"BL":2}}],"variaveis":["jogador"]},{"id":"IMP-043","titulo":"Jogador descontente","seccao":"Jogadores, balneário e academia","quando":"jogador titular ou ex-titular com moral baixa, pediu para sair","modo":"AMBOS","jornalista":"imprensa desportiva","tipoJornalista":"desportiva","pergunta":"O {jogador} não está feliz e quer sair. O que vai fazer?","respostas":[{"letra":"A","tom":"firme","texto":"Tem contrato e vai cumpri-lo. Aqui não se trocam jogadores por birras.","efeitos":{"AD":1,"BL":-1,"EQ":-1,"DN":1},"notas":"Jogador mantém-se descontente (moral continua baixa)"},{"letra":"B","tom":"dialogante","texto":"Vamos falar com ele e perceber os motivos. Todos têm direito a ser ouvidos.","efeitos":{"BL":1,"EQ":1}},{"letra":"C","tom":"aberta","texto":"Se for o desejo dele e a proposta for justa, avaliamos a saída.","efeitos":{"BL":1,"AD":-1,"DN":1},"notas":"(do jogador),  . Abre a porta a negociações"}],"variaveis":["jogador"]},{"id":"IMP-044","titulo":"Promoção de um jovem da academia","seccao":"Jogadores, balneário e academia","quando":"jovem sub-18 ou sub-21 promovido à equipa principal com bom rendimento","modo":"AMBOS","jornalista":"blogue de adeptos","tipoJornalista":"blogue","pergunta":"O {jovem} brilhou. A academia vai ser a base do futuro do clube?","respostas":[{"letra":"A","tom":"orgulhosa","texto":"A academia é o nosso orgulho. Vamos continuar a investir nela e a dar oportunidades.","efeitos":{"AD":2,"DN":1,"BL":1}},{"letra":"B","tom":"cuidadosa","texto":"É cedo para o dizer. O {jovem} tem talento, mas tem de continuar a crescer.","efeitos":{"IM":1}},{"letra":"C","tom":"comercial","texto":"Um jovem que brilha também atrai olhares. Estamos atentos ao valor de mercado.","efeitos":{"AD":-1,"DN":1}}],"variaveis":["jovem"]},{"id":"IMP-045","titulo":"Indisciplina","seccao":"Jogadores, balneário e academia","quando":"jogador expulso ou com polémica fora de campo","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"O {jogador} foi expulso/envolveu-se em polémica. Que medidas vão tomar?","respostas":[{"letra":"A","tom":"rigorosa","texto":"Haverá sanção interna. Ninguém está acima do clube.","efeitos":{"BL":-1,"EQ":-1,"AD":1,"DN":1}},{"letra":"B","tom":"compreensiva","texto":"Foi um deslize isolado e vamos falar com ele. Conhecemos o carácter do jogador.","efeitos":{"BL":1,"IM":-1}},{"letra":"C","tom":"silenciosa","texto":"Assuntos internos tratam-se internamente. Não vou comentar mais.","efeitos":{"IM":-1}}],"variaveis":["jogador"]},{"id":"IMP-046","titulo":"Capitão e liderança","seccao":"Jogadores, balneário e academia","quando":"o {capitao} tem moral baixa ou forma má","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"O capitão {capitao} tem estado abaixo do esperado. Mantém-lhe a braçadeira?","respostas":[{"letra":"A","tom":"confiante","texto":"Mantenho. A liderança não se mede só pelos golos, e ele continua a ser uma referência.","efeitos":{"BL":1,"EQ":1}},{"letra":"B","tom":"exigente","texto":"A braçadeira exige exemplo. Se não melhorar, teremos de reavaliar.","efeitos":{"EQ":-1,"BL":-1}},{"letra":"C","tom":"protectora","texto":"Os jogadores passam por fases, e o capitão tem todo o meu apoio.","efeitos":{"BL":1,"AD":-1}}],"variaveis":["capitao"]},{"id":"IMP-047","titulo":"Cláusula de rescisão","seccao":"Jogadores, balneário e academia","quando":"jogador com cláusula de rescisão activada por outro clube","modo":"AMBOS","jornalista":"imprensa desportiva","tipoJornalista":"desportiva","pergunta":"O {adversario} pagou a cláusula de rescisão do {jogador}. Estão impotentes?","respostas":[{"letra":"A","tom":"resignada","texto":"A cláusula existe para isto. É um direito do jogador, e vamos usar o dinheiro de forma inteligente.","efeitos":{"DN":1,"AD":-1}},{"letra":"B","tom":"queixosa","texto":"É um valor muito abaixo do que ele vale. Foi um erro negociá-la naquele patamar.","efeitos":{"AD":-1,"DN":-1,"IM":1}},{"letra":"C","tom":"orgulhosa","texto":"Formámos um jogador que vale tanto dinheiro. Isso é uma vitória do clube.","efeitos":{"AD":1,"DN":1}}],"variaveis":["adversario","jogador"]},{"id":"IMP-048","titulo":"Preço dos bilhetes","seccao":"Adeptos, estádio e infraestruturas","quando":"o clube subiu os preços dos bilhetes ou das quotas","modo":"AMBOS","jornalista":"blogue de adeptos","tipoJorna   const ev = JG.sim.eventos, g = JG.sim.estado.score;
  const jogaram = new Set(JG.sim.estado.players.filter((q) => q.team === 0).map((q) => q.id));
  return JG.cfg.equipas[0].onze.concat(JG.cfg.equipas[0].banco).filter((p) => jogaram.has(p.id)).map((p) => {
    const golos = ev.filter((x) => x.tipo === 'golo' && x.jogador === p.id).length;
    const def = ev.filter((x) => (x.tipo === 'desarme' || x.tipo === 'intercepcao' || x.tipo === 'defesa') && x.jogador === p.id).length;
    const r = avRng(avHash('nota' + p.id + g.join('-')));

}

  const d = ent.rascunho, passos = ['Conta', 'Perfil', 'Foto', 'Clube'];

  const cab = `<div class="en-marca">FutCEO</div><div class="en-passos">${passos.map((x, i) => `<span class="${i === idx ? 'on' : i < idx ? 'feito' : ''}">${i + 1}. ${x}</span>`).join('')}</div>`;

  if (ent.passo === 'login') corpo = `<h2>Entrar</h2><form id="en-form" autocomplete="off"><label>Utilizador<input id="en-user" required autocomplete="username"></label><label>Palavra-passe<input id="en-pass" type="password" required autocomplete="current-password"></label>${erro}<button class="btn prim en-btn" type="submit">Entrar</button></form><div class="rot">Há 3 contas neste aparelho; cada uma tem o seu perfil e as suas gravações.</div>`;
  else if (ent.passo === 'retomar') { const p = lerPerfil(ent.conta); corpo = `<h2>Bem-vindo de volta</h2><div class="en-perfil">${avatarHtml(p, 64)}<div><b>${p.nome}</b><div class="rot">Presidente · ${p.clube}${p.dataJogo ? ` · gravado em ${p.dataJogo}` : ''}</div></div></div><button class="btn prim en-btn" id="en-continuar">Continuar carreira</button><button class="btn en-btn" id="en-novo">Criar um perfil novo</button><button class="btn en-btn" id="en-sair">Mudar de conta</button>`; }
  else if (ent.passo === 'perfil') {
    const lista = PERFIS_DONO;
    corpo = `<h2>Perfil de jogo</h2><form id="en-form"><label>Nome<input id="en-nome" required maxlength="40" value="${d.nome ?? ''}"></label>
      <div class="en-duas"><label>Data de nascimento<input id="en-nasc" type="date" required value="${d.nasc ?? ''}" max="2008-11-16"></label><label>Nacionalidade<select id="en-nac" required><option value="">Escolher…</option>${NACIONALIDADES.map((n) => `<option ${d.nac === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
      <div class="en-rot">Perfil de partida (modo Dono)</div>
      <div class="en-cartoes">${lista.map(([id, txt, fort, ef], i) => `<label class="en-cartao ${d.perfil === id ? 'on' : ''}"><input type="radio" name="en-perf" value="${id}" ${d.perfil === id ? 'checked' : ''}><span class="en-num">${i + 1}</span><span><span>${txt}</span>${fort ? `<span class="chip info" style="margin-top:6px">Património: ${fM2(fort)}</span>` : ''}<span class="en-ef">${ef}</span></span></label>`).join('')}</div>
      ${erro}<div class="en-nav"><button type="button" class="btn" id="en-sair">Mudar de conta</button><button class="btn prim" type="submit">Seguinte ›</button></div></form>`;
  } else if (ent.passo === 'foto') corpo = `<h2>Foto de perfil <span class="rot">(opcional)</span></h2><div class="en-foto">${avatarHtml({ nome: d.nome, foto: d.foto }, 120)}<div style="display:grid;gap:8px"><label class="btn" style="text-align:center;cursor:pointer">Escolher foto<input id="en-ficheiro" type="file" accept="image/*" hidden></label>${d.foto ? '<button class="btn" id="en-tirar">Tirar foto</button>' : ''}<div class="rot">A foto fica só neste aparelho.</div></div></div><div class="en-nav"><button class="btn" id="en-voltar">‹ Voltar</button><button class="btn prim" id="en-seg">${d.foto ? 'Seguinte ›' : 'Saltar ›'}</button></div>`;

      ${erro}<div class="en-nav"><button class="btn" id="en-voltar">‹ Voltar</button><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="en-avatares" ${d.clube ? '' : 'disabled'}>Editar avatares</button><button class="btn prim" id="en-fim" ${d.clube ? '' : 'disabled'}>Começar a carreira</button></span></div>`;

function mostrarEntrada() { let el = document.getElementById('entrada'); if (!el) { el = document.createElement('div'); el.id = 'entrada'; document.body.appendChild(el); } const y = el.querySelector('.en-painel')?.scrollTop ?? 0; el.innerHTML = entradaHtml(); el.querySelector('.en-painel').scrollTop = y; ligarEntrada(el); }
function aplicarPerfil(p) {
  PERFIL_ACTIVO = p; VARS_PROTO.dono = p.nome;
  const i = LIGA.indexOf(p.clube);
  if (i >= 0 && p.clube !== CLUBE.nome) { tabela.forEach((t) => { if (t.nome === CLUBE.nome) t.cores = CORES[LIGA.indexOf(CLUBE.nome)]; }); CLUBE.nome = p.clube; CLUBE.curto = curtoDe(p.clube); CLUBE.cores = CORES[i]; VARS_PROTO.clube = CLUBE.curto; }
  document.getElementById('nome-clube-lat').textContent = CLUBE.nome;
  acento(); desenhar();
}
function ligarEntrada(el) {
  const d = ent.rascunho, ir = (p) => { ent.passo = p; ent.erro = null; mostrarEntrada(); };
  el.querySelector('#en-sair')?.addEventListener('click', () => { ent = { passo: 'login', rascunho: { modo: 'dono' } }; mostrarEntrada(); });
  if (ent.passo === 'login') el.querySelector('#en-form').addEventListener('submit', async (e) => {
    e.preventDefault(); const u = el.querySelector('#en-user').value.trim().toLowerCase(), pw = el.querySelector('#en-pass').value;
    const c = CONTAS[u]; const ok = c && (await sha256(`futceo:${u}:${pw}`)) === c[1];
    if (!ok) { ent.erro = 'Utilizador ou palavra-passe errados.'; mostrarEntrada(); return; }
    ent.conta = u; ir(lerPerfil(u) ? 'retomar' : 'perfil');
  });
  el.querySelector('#en-continuar')?.addEventListener('click', () => { aplicarPerfil(lerPerfil(ent.conta)); el.remove(); });
  el.querySelector('#en-novo')?.addEventListener('click', () => { ent.rascunho = { modo: 'dono' }; ir('perfil'); });
  if (ent.passo === 'perfil') {
    const guardar = () => { d.nome = el.querySelector('#en-nome').value.trim(); d.nasc = el.querySelector('#en-nasc').value; d.nac = el.querySelector('#en-nac').value; d.perfil = el.querySelector('input[name="en-perf"]:checked')?.value ?? d.perfil; };
    el.querySelectorAll('input[name="en-perf"]').forEach((r) => r.addEventListener('change', () => { guardar(); mostrarEntrada(); }));
    el.querySelector('#en-form').addEventListener('submit', (e) => { e.preventDefault(); guardar();
      const idade = d.nasc ? (new Date('2026-11-16') - new Date(d.nasc)) / 3.15576e10 : 0;
      ent.erro = !d.nome ? 'Falta o nome.' : idade < 18 ? 'É preciso ter pelo menos 18 anos.' : !d.nac ? 'Falta a nacionalidade.' : !d.perfil ? 'Escolhe um perfil.' : null;
      if (ent.erro) mostrarEntrada(); else ir('foto'); });
  }
  el.querySelector('#en-ficheiro')?.addEventListener('change', (e) => { const f = e.target.files[0]; if (!f) return; const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), m = Math.min(img.width, img.height); g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 256, 256); d.foto = c.toDataURL('image/jpeg', 0.85); URL.revokeObjectURL(img.src); mostrarEntrada(); }; img.src = URL.createObjectURL(f); });
  el.querySelector('#en-tirar')?.addEventListener('click', () => { d.foto = null; mostrarEntrada(); });
  el.querySelector('#en-voltar')?.addEventListener('click', () => ir(ent.passo === 'avatares' ? 'clube' : ent.passo === 'clube' ? 'foto' : 'perfil'));
  el.querySelector('#en-avatares')?.addEventListener('click', () => ir('avatares'));
  ligarEditor(el, () => mostrarEntrada());
  el.querySelector('#en-seg')?.addEventListener('click', () => ir('clube'));
  el.querySelectorAll('[data-clube]').forEach((b) => b.addEventListener('click', () => { d.clube = b.dataset.clube; mostrarEntrada(); }));
  el.querySelector('#en-fim')?.addEventListener('click', () => { const p = { conta: ent.conta, ...d, criado: '2026-11-16' }; gravarPerfil(ent.conta, p); aplicarPerfil(p); el.remove(); });
}
if (!/semEntrada/.test(location.search)) { ent = { passo: 'login', rascunho: { modo: 'dono' } }; mostrarEntrada(); }


// ---------- Editor de avatares (antes de começar a carreira) ----------

  return {
    Plantel: plantel.map((p) => ({ ...avJog(p), rot: `${p.pos} · ${p.idade} anos`, kit: kitClube(p.n) })),
    Juniores: [...sub21, ...sub18].map((p) => ({ id: 'jr:' + p.nome, nome: p.nome, pais: p.pais ?? 'POR', idade: p.idade, pos: p.pos, rot: `${p.pos} · ${p.idade} anos`, kit: kitClube(p.n) })),
    Staff: staff.map((x) => { const [n, i] = x.split('|'); return { id: 's:' + n, nome: n, pais: 'POR', idade: +i, staff: true, rot: `${i} anos`, kit: { fato: true } }; }),
    'Outros clubes': LISTADOS.slice(0, 30).map((x, i) => ({ id: 'm:' + x.nome, nome: x.nome, pais: ['ESP', 'BRA', 'NGA', 'ENG', 'ARG', 'NED'][i % 6], idade: x.idade ?? 24, pos: x.pos, rot: `${x.pos} · ${x.clube}`, kit: { c1: '#3a4458', c2: '#e8e8ea', padrao: 'liso' } })),
  };
}
function editorAvatares() {

  const sel = Object.values(grupos).flat().find((x) => x.id === edSel) ?? lista[0];
  edSel = sel?.id;
  const t = sel ? avTracos(sel) : null, editado = sel && avEdit[sel.id];
  const val = (k) => k === 'pele' ? `<i class="ed-cor" style="background:${AV.pele[t.pele]}"></i>${t.pele + 1}` : k === 'corCabelo' ? `<i class="ed-cor" style="background:${AV.corCabelo[t.corCabelo]}"></i>${AV.rot.corCabelo[t.corCabelo]}` : k === 'corOlhos' ? `<i class="ed-cor" style="background:${AV.corOlhos[t.corOlhos]}"></i>${AV.rot.corOlhos[t.corOlhos]}` : AV.rot[k] ? AV.rot[k][t[k]] : `Tipo ${t[k] + 1}`;
  return `<h2>Editor de avatares <span class="rot">(opcional)</span></h2>
    <div class="ed"><div class="ed-lista"><div class="seg ed-grupos" role="group">${Object.keys(grupos).map((g) => `<button data-edg="${g}" class="${g === edGrupo ? 'on' : ''}">${g}</button>`).join('')}</div>
      <input id="ed-pesq" type="search" placeholder="Pesquisar…" value="${edPesq}" aria-label="Pesquisar pessoa">
      <div class="ed-itens">${lista.map((x) => `<button class="ed-item ${x.id === edSel ? 'on' : ''}" data-eds="${x.id}">${avatarSvg(x, { tam: 34, kit: x.kit })}<span><b>${x.nome}</b><small>${x.rot}${avEdit[x.id] ? ' · editado' : ''}</small></span></button>`).join('')}</div></div>
    ${sel ? `<div class="ed-prev"><div class="ed-av">${avatarSvg(sel, { tam: 150, kit: sel.kit })}</div><b>${sel.nome}</b><small class="rot">${sel.rot}${editado ? ' · editado' : ''}</small>
      <div class="ed-tracos">${Object.keys(AV.max).map((k) => `<div class="ed-t"><button class="ed-s" data-edt="${k}:-1" aria-label="${AV.nomes[k]} anterior">‹</button><span><small>${AV.nomes[k]}</small><b>${val(k)}</b></span><button class="ed-s" data-edt="${k}:1" aria-label="${AV.nomes[k]} seguinte">›</button></div>`).join('')}</div>
      <details class="ed-med"><summary>Medidas do rosto</summary>${[['largura', 'Largura da cara'], ['comprimento', 'Comprimento'], ['maxilar', 'Maxilar'], ['queixo', 'Queixo'], ['olhosDist', 'Distância dos olhos'], ['olhosTam', 'Tamanho dos olhos'], ['narizComp', 'Comprimento do nariz'], ['narizLarg', 'Largura do nariz'], ['bocaLarg', 'Largura da boca'], ['labios', 'Lábios'], ['sobrAlt', 'Altura das sobrancelhas'], ['orelhas', 'Orelhas']].map(([k, n]) => `<label class="ed-sl"><span>${n}</span><input type="range" min="0" max="100" value="${Math.round(avMedidas(sel)[k] * 100)}" data-edm="${k}"></label>`).join('')}</details>
      <div class="ed-acoes"><button class="btn" id="ed-aleat">Aleatório</button><button class="btn" id="ed-repor" ${editado ? '' : 'disabled'}>Repor</button></div></div>` : ''}</div>
    <div class="rot">As alterações ficam guardadas neste aparelho e valem para todas as carreiras novas. Os jovens que entrarem na academia recebem o seu próprio avatar.</div>
    <div class="en-nav"><button class="btn" id="en-voltar">‹ Voltar</button><button class="btn prim" id="en-fim">Começar a carreira</button></div>`;

function ligarEditor(el, redesenhar) {
  const sel = () => Object.values(pessoasEditor()).flat().find((x) => x.id === edSel);
  el.querySelectorAll('[data-edg]').forEach((b) => b.addEventListener('click', () => { edGrupo = b.dataset.edg; edSel = null; redesenhar(); }));
  el.querySelectorAll('[data-eds]').forEach((b) => b.addEventListener('click', () => { edSel = b.dataset.eds; redesenhar(); }));
  const q = el.querySelector('#ed-pesq'); if (q) q.addEventListener('input', () => { edPesq = q.value; const pos = q.selectionStart; redesenhar(); const n = document.getElementById('ed-pesq'); n.focus(); n.setSelectionRange(pos, pos); });
  el.querySelectorAll('[data-edt]').forEach((b) => b.addEventListener('click', () => { const p = sel(); if (!p) return; const [k, d] = b.dataset.edt.split(':'); const t = avTracos(p); avEdit[p.id] = { ...(avEdit[p.id] ?? {}), [k]: (t[k] + +d + AV.max[k]) % AV.max[k] }; avGravar(); redesenhar(); }));
  el.querySelectorAll('[data-edm]').forEach((r) => r.addEventListener('change', () => { const p = sel(); if (!p) return; const e = avEdit[p.id] ?? {}; avEdit[p.id] = { ...e, medidas: { ...(e.medidas ?? {}), [r.dataset.edm]: +r.value / 100 } }; avGravar(); const ab = document.querySelector('.ed-med')?.open; redesenhar(); if (ab) document.querySelector('.ed-med').open = true; }));
  el.querySelector('#ed-aleat')?.addEventListener('click', () => { const p = sel(); const r = avRng(Date.now() >>> 0); avEdit[p.id] = Object.fromEntries(Object.keys(AV.max).map((k) => [k, k === 'oculos' && !p.staff ? 0 : Math.floor(r() * AV.max[k])])); avGravar(); redesenhar(); });
  el.querySelector('#ed-repor')?.addEventListener('click', () => { delete avEdit[edSel]; avGravar(); redesenhar(); });
}

// ---------- Guardar ----------
// A gravação é automática (cada dia avançado, por perfil); o botão força uma gravação e confirma. Na app: IndexedDB, no worker.
function guardarProgresso(avisar) {
  const quando = new Date();
  if (PERFIL_ACTIVO) { PERFIL_ACTIVO.dataJogo = fmtData(hoje); PERFIL_ACTIVO.gravadoEm = quando.toISOString(); gravarPerfil(PERFIL_ACTIVO.conta, PERFIL_ACTIVO); }
  if (!avisar) return;
  let t = document.getElementById('aviso-gravar'); if (!t) { t = document.createElement('div'); t.id = 'aviso-gravar'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.innerHTML = `<b>Progresso guardado</b><span>${fmtData(hoje)} · ${quando.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' })}${PERFIL_ACTIVO ? ` · perfil de ${PERFIL_ACTIVO.nome.split(' ')[0]}` : ''}</span><small>A gravação automática continua activa.</small>`;
  t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600);
}

// ---------- Ecrã de carregamento (intro) ----------
// Na app, as etapas e a percentagem vêm do worker (mundo, gravação, motor); no protótipo são simuladas (~2,5 s).
(function intro() {
  const DICAS = [
    'As promessas à imprensa ficam registadas e têm prazo.',
    'Um jovem titular evolui mais depressa, sobretudo numa liga forte.',
    'Subir o preço do bilhete enche menos o estádio e baixa a satisfação dos adeptos.',
    'A janela de mercado aparece no calendário com o ícone 🔁.',
    'Os finalistas dos prémios são anunciados a 16 de Julho; a cerimónia é a 30.',
  ];
  const ETAPAS = [['A carregar o mundo…', 35], ['A ler a gravação…', 60], ['A preparar a época…', 85], ['A abrir o clube…', 100]];
  const el = document.createElement('div');
  el.id = 'intro'; el.setAttribute('role', 'status'); el.setAttribute('aria-label', 'A carregar o FutCEO');
  el.innerHTML = `<img src="intro.jpg" alt=""><div class="in-topo"><div class="in-logo">FutCEO</div><div class="in-sub">Gestão de futebol</div></div>
    <div class="in-baixo"><div class="in-etapa">A iniciar…</div><div class="in-barra"><i></i></div><div class="in-dica">${DICAS[Math.floor(Math.random() * DICAS.length)]}</div><div class="in-saltar">Toca para continuar</div></div>`;
  document.body.appendChild(el);
  const fechar = () => { el.classList.add('fora'); setTimeout(() => el.remove(), 500); };
  el.addEventListener('click', fechar);
  let k = 0;
  const passo = () => {
    if (!document.body.contains(el)) return;
    if (k >= ETAPAS.length) { setTimeout(fechar, 350); return; }
    const [txt, pct] = ETAPAS[k++];
    el.querySelector('.in-etapa').textContent = txt; el.querySelector('.in-barra i').style.width = pct + '%';
    setTimeout(passo, 600);
  };
  setTimeout(passo, 150);
})();
