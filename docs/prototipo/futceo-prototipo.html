<title>FutCEO Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Disposição: barra lateral (tablet) / barra inferior (telemóvel) + área de cartões; números grandes condensados; acento = cor do clube. */
:root {
  --fundo: #0b0d10;
  --cartao: #16191e;
  --cartao-2: #1d2128;
  --linha: #2a2f38;
  --texto: #e8eaee;
  --suave: #9097a3;
  --fraco: #5f6672;
  --acento: #d63a3a;
  --acento-2: #f1f1f1;
  --bom: #3fb67a;
  --aviso: #e2a33a;
  --mau: #e0565b;
  --info: #5a9be0;
  --c-liga: #e0565b; --c-taca: #9aa1ab; --c-ucl: #4a86e8; --c-uel: #f2b632; --c-uecl: #3fb67a; --c-pausa: #d9c49a;
  --f-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-texto: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-dados: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  --raio: 12px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--fundo); color: var(--texto); font-family: var(--f-texto); font-size: 14px; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
.lateral { background: #0f1216; border-right: 1px solid var(--linha); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; overflow-y: auto; }
.marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.marca b { font-family: var(--f-num); font-size: 24px; letter-spacing: .5px; }
.marca small { display: block; color: var(--suave); font-size: 11px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--suave); text-decoration: none; font-weight: 500; }
.nav:hover { background: var(--cartao); color: var(--texto); }
.nav.activo { background: var(--cartao-2); color: var(--texto); box-shadow: inset 3px 0 0 var(--acento); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav-sep { height: 1px; background: var(--linha); margin: 10px 4px; }
.nav.extra { opacity: .55; }

.principal { overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; min-width: 0; }
.topo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px; }
.topo h1 { font-family: var(--f-num); font-weight: 600; font-size: 30px; margin: 0; letter-spacing: .3px; text-wrap: balance; }
.topo .sub { color: var(--suave); }
.topo .direita { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--cartao-2); color: var(--suave); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.bom { color: var(--bom); } .chip.aviso { color: var(--aviso); } .chip.mau { color: var(--mau); } .chip.info { color: var(--info); }
.chip .pt { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.btn { border: 1px solid var(--linha); background: var(--cartao-2); padding: 8px 14px; border-radius: 10px; font-weight: 600; min-height: 40px; }
.btn.prim { background: var(--acento); border-color: var(--acento); color: var(--acento-2); }
.btn:hover { border-color: var(--suave); }

.grelha { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.c { background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; min-width: 0; }
.c h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--suave); margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.c h2 .acao { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--acento); font-weight: 600; cursor: pointer; }
.s9 { grid-column: span 9; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.num { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.grande { font-size: 40px; line-height: 1; }
.medio { font-size: 26px; line-height: 1; }
.rot { color: var(--suave); font-size: 12px; }
.muted { color: var(--suave); }
.linha-kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--linha); }
.linha-kv:last-child { border-bottom: 0; }
.linha-kv span:last-child { font-variant-numeric: tabular-nums; }

.escudo { width: 34px; height: 38px; flex: none; }
.forma { display: inline-flex; gap: 4px; }
.forma i { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; color: #0b0d10; }
.forma .V { background: var(--bom); } .forma .E { background: #8a919c; } .forma .D { background: var(--mau); }

.proximo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.equipa { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 110px; text-align: center; }
.equipa .escudo { width: 52px; height: 58px; }
.vs { text-align: center; }

.tab-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--fraco); font-weight: 600; padding: 8px 8px; border-bottom: 1px solid var(--linha); white-space: nowrap; position: sticky; top: 0; background: var(--cartao); }
td { padding: 9px 8px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
tr.clic { cursor: pointer; } tr.clic:hover td { background: var(--cartao-2); }
tr.meu td { background: color-mix(in srgb, var(--acento) 16%, transparent); }
td.r, th.r { text-align: right; }
.ovr { display: inline-grid; place-items: center; min-width: 34px; height: 26px; border-radius: 7px; font-family: var(--f-num); font-weight: 700; font-size: 17px; background: var(--cartao-2); }
.ovr.qa { color: #7fe0a5; } .ovr.qb { color: #c9e27a; } .ovr.qc { color: #e8c46a; } .ovr.qd { color: #e69a6a; }
.intervalo { font-family: var(--f-dados); font-size: 12px; color: var(--aviso); }
.barra { height: 6px; border-radius: 3px; background: var(--cartao-2); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--acento); }
.zona { width: 3px; padding: 0; }
.zona.ucl { background: var(--info); } .zona.uel { background: var(--aviso); } .zona.desc { background: var(--mau); }

.filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filtros input, .filtros select { background: var(--cartao-2); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 12px; min-height: 40px; }
.filtros input { flex: 1; min-width: 180px; }
.seg { display: inline-flex; background: var(--cartao-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }

.seg button.on { background: var(--cartao); color: var(--texto); }

.jogador-topo { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.dorsal { width: 64px; height: 64px; border-radius: 50%; background: var(--acento); color: var(--acento-2); display: grid; place-items: center; font-family: var(--f-num); font-size: 30px; font-weight: 700; flex: none; }
.estrelas { color: var(--aviso); letter-spacing: 2px; font-size: 15px; }
.atrib { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.atrib .v { font-family: var(--f-num); font-size: 18px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.v20 { color: #7fe0a5; } .v15 { color: #c9e27a; } .v10 { color: var(--texto); } .v5 { color: #e69a6a; }
.papeis { display: grid; gap: 8px; }
.papel { display: grid; grid-template-columns: 1fr 120px 28px; align-items: center; gap: 10px; }

.campo { position: relative; aspect-ratio: 68/100; max-width: 420px; width: 100%; margin: 0 auto; border-radius: 10px; overflow: hidden;
  background: repeating-linear-gradient(0deg, #1f5a35 0 9%, #23633b 9% 18%); border: 2px solid #2e7a4a; }
.campo .lin { position: absolute; border: 2px solid rgba(255,255,255,.35); }

.peca b { width: 34px; height: 34px; border-radius: 50%; background: var(--acento); color: var(--acento-2); display: grid; place-items: center; font-family: var(--f-num); font-size: 16px; border: 2px solid rgba(255,255,255,.7); }

.instr { display: grid; gap: 12px; }

.barras-fin { display: grid; gap: 10px; }
.bf { display: grid; grid-template-columns: 130px 1fr 80px; align-items: center; gap: 10px; }
.bf .t { height: 14px; border-radius: 4px; background: var(--cartao-2); overflow: hidden; }
.bf .t i { display: block; height: 100%; }

.janela { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--aviso) 14%, var(--cartao)); border: 1px solid color-mix(in srgb, var(--aviso) 45%, transparent); }
.ronda { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
.ronda:last-child { border-bottom: 0; }

.aviso-proto { font-size: 12px; color: var(--fraco); margin-top: 18px; }
.cores { display: inline-flex; gap: 6px; }
.cores button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--linha); }

.inferior { display: none; }
.adeptos { position: relative; overflow: hidden; padding: 0; min-height: 300px; }
.adeptos > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
.adeptos::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,13,16,.92) 0%, rgba(11,13,16,.75) 45%, rgba(11,13,16,.25) 100%); }
.ad-conteudo { position: relative; z-index: 1; padding: 18px; display: grid; gap: 14px; max-width: 620px; }
.ad-grandes { display: flex; gap: 28px; flex-wrap: wrap; }
.ad-grandes > div { display: flex; flex-direction: column; }
.ad-grandes .num { font-size: 44px; line-height: 1; color: #fff; }
.ad-linhas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 18px; }
.ad-linhas > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

@media (max-width: 760px) { .ad-linhas { grid-template-columns: repeat(2, minmax(0, 1fr)); } .adeptos::after { background: linear-gradient(180deg, rgba(11,13,16,.85), rgba(11,13,16,.7)); } }
.banner-mercado { position: relative; border-radius: var(--raio); overflow: hidden; margin-bottom: 14px; aspect-ratio: 588/250; max-height: 300px; width: 100%; border: 1px solid var(--linha); }
.banner-mercado img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 55%; }
.banner-mercado::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,13,16,.65) 0%, rgba(11,13,16,.1) 40%, rgba(11,13,16,.35) 100%); }
.bm-topo { position: absolute; left: 16px; top: 12px; z-index: 1; }
.bm-topo h1 { margin: 0; font-family: var(--f-num); font-weight: 600; font-size: 30px; }
.bm-topo span { color: #cfd3da; font-size: 13px; }
.bm-contagem { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 22px; border-radius: 14px; background: rgba(11,13,16,.62); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,.12); text-align: center; }
.bm-estado { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--aviso); font-weight: 600; }
.bm-contagem.aberta .bm-estado { color: var(--bom); }
.bm-dias { font-size: 56px; line-height: 1; font-weight: 700; }
.bm-texto { color: #e8eaee; font-size: 13px; }
@media (max-width: 760px) { .banner-mercado { aspect-ratio: 588/330; } .bm-dias { font-size: 42px; } .bm-topo h1 { font-size: 24px; } .bm-topo span { display: none; } }
.barra-topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0 14px; margin-bottom: 14px; border-bottom: 1px solid var(--linha); }
.data { display: flex; flex-direction: column; line-height: 1.15; }
.data b { font-family: var(--f-num); font-size: 22px; font-weight: 600; }
.data span { color: var(--suave); font-size: 12px; }
.icone-btn { position: relative; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--linha); background: var(--cartao-2); display: grid; place-items: center; }
.icone-btn svg { width: 20px; height: 20px; }
.icone-btn .badge { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--acento); color: var(--acento-2); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.barra-topo .continuar { margin-left: auto; }
.fundo-modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--cartao); border: 1px solid var(--linha); border-radius: 16px; width: min(560px, 100%); max-height: 90%; overflow: auto; padding: 18px; }
.modal-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.modal-cab h3 { margin: 0; font-family: var(--f-num); font-size: 24px; font-weight: 600; flex: 1; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dsem { text-align: center; font-size: 11px; color: var(--fraco); text-transform: uppercase; padding: 4px 0; }
.cal .dia { min-height: 88px; border-radius: 10px; background: var(--cartao-2); padding: 5px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; min-width: 0; }

.cal .dia .n { font-weight: 600; }
.cal .jogo { font-size: 10px; line-height: 1.2; border-radius: 5px; padding: 2px 4px; background: color-mix(in srgb, var(--acento) 30%, transparent); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.cal .partida .adv { font-size: 11px; font-weight: 600; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 3; word-break: break-word; -webkit-box-orient: vertical; overflow: hidden; }

.legenda { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 10px; font-size: 12px; color: var(--suave); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }

td .escudo { width: 18px; height: 20px; }
.zi { width: 26px; padding-left: 0; padding-right: 0; } .zi .ci, .zi svg { vertical-align: middle; }
td .ci { width: 17px; height: 17px; border-radius: 4px; display: inline-grid; place-items: center; color: #0b0d10; } td .ci svg { width: 11px; height: 11px; }
.legenda .ci { display: inline-grid; }
.cal .jogo.taca { background: color-mix(in srgb, var(--info) 35%, transparent); }
.cal .jogo.janela { background: color-mix(in srgb, var(--aviso) 30%, transparent); }
.msg { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linha); align-items: start; }
.msg .nl { width: 8px; height: 8px; border-radius: 50%; background: var(--acento); margin-top: 6px; }
.msg.lida .nl { background: transparent; }

.prof { position: relative; max-width: 760px; margin: 0 auto; aspect-ratio: 74/100; border-radius: 12px; overflow: hidden; background: repeating-linear-gradient(0deg, #1f5a35 0 8%, #23633b 8% 16%); border: 2px solid #2e7a4a; }
.prof .caixa { position: absolute; transform: translate(-50%,-50%); width: min(30%, 210px); background: var(--cartao); border: 1px solid var(--linha); border-radius: 10px; padding: 4px 6px; box-shadow: 0 6px 16px rgba(0,0,0,.45); }

.prof .lin-j { cursor: pointer; display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: center; padding: 4px; border-top: 1px solid var(--linha); min-width: 0; }

.notas-eq { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; margin-bottom: 10px; }

.nota-eq.qa { color: #7fe0a5; } .nota-eq.qb { color: #c9e27a; } .nota-eq.qc { color: #e8c46a; } .nota-eq.qd { color: #e69a6a; }
.dinamica { margin-left: auto; display: flex; flex-direction: column; justify-content: center; text-align: right; }

.dep { position: relative; aspect-ratio: 70/100; max-width: 640px; margin: 0 auto; border-radius: 10px; overflow: hidden; border: 2px solid #2e7a4a;
  background: radial-gradient(circle at 50% 50%, transparent 0 13%, rgba(255,255,255,.35) 13% 13.4%, transparent 13.6%), linear-gradient(transparent 49.7%, rgba(255,255,255,.35) 49.7% 50.3%, transparent 50.3%), repeating-linear-gradient(0deg, #2a6e3e 0 7%, #2f7843 7% 14%); }
.dep::before, .dep::after { content: ""; position: absolute; left: 30%; width: 40%; height: 11%; border: 2px solid rgba(255,255,255,.35); }
.dep::before { top: -2px; } .dep::after { bottom: -2px; }

.dl { display: flex; align-items: center; gap: 4px; padding: 2px 3px 2px 6px; border-top: 1px solid rgba(255,255,255,.06); cursor: pointer; min-width: 0; }

// ---------- ilustrações isométricas das infraestruturas (geradas pelo nível e pelo tamanho do clube) ----------
let ISO_ID = 0;
const hexRgb = (h) => { const v = parseInt(h.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; };
const tom = (h, f) => { if (!h.startsWith('#')) return h; const [r, g, b] = hexRgb(h); const c = (x) => Math.max(0, Math.min(255, Math.round(f >= 0 ? x + (255 - x) * f : x * (1 + f)))); return `rgb(${c(r)},${c(g)},${c(b)})`; };
const faces = (h) => [tom(h, 0.12), tom(h, -0.38), tom(h, -0.2)];
function Iso(w, h, esc, ox, oy) {
  const id = `iso${++ISO_ID}`;
  const out = [];
  const P = (x, y, z = 0) => [ox + (x - y) * 0.866 * esc, oy + (x + y) * 0.5 * esc - z * esc];
  const pts = (a) => a.map((q) => P(...q).map((v) => v.toFixed(1)).join(',')).join(' ');
  const defs = `<defs>
    <pattern id="${id}-relva" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#4f7a43"/><circle cx="1" cy="2" r=".7" fill="#5d8a4f"/><circle cx="4" cy="4.5" r=".6" fill="#456d3b"/><circle cx="4.5" cy="1" r=".5" fill="#6a9659"/></pattern>
    <pattern id="${id}-betao" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#9a9c98"/><path d="M0 8L8 0" stroke="#8d8f8b" stroke-width=".6"/><circle cx="2" cy="5" r=".5" fill="#a9aba7"/></pattern>
    <pattern id="${id}-asfalto" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#3e4248"/><circle cx="1.2" cy="1.5" r=".45" fill="#4a4e55"/><circle cx="3.6" cy="3.8" r=".4" fill="#363a40"/></pattern>
    <linearGradient id="${id}-ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22362c"/><stop offset="1" stop-color="#121c17"/></linearGradient>
    <linearGradient id="${id}-vidro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe6f2" stop-opacity=".75"/><stop offset="1" stop-color="#8fb6cc" stop-opacity=".45"/></linearGradient>
    <radialGradient id="${id}-luz" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe0" stop-opacity=".9"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="${id}-copa" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#5f9a55"/><stop offset=".6" stop-color="#2f6b3a"/><stop offset="1" stop-color="#1f4a28"/></radialGradient>
  </defs>`;
  const api = {
    id, P,
    poly: (a, fill, extra = '') => out.push(`<polygon points="${pts(a)}" fill="${fill}" ${extra}/>`),
    plano: (x, y, w, d, z, fill, extra = '') => api.poly([[x, y, z], [x + w, y, z], [x + w, y + d, z], [x, y + d, z]], fill, extra),
    line: (a, b, cor, lw = 1, extra = '') => { const [x1, y1] = P(...a), [x2, y2] = P(...b); out.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${cor}" stroke-width="${lw}" stroke-linecap="round" ${extra}/>`); },
    sombra: (x, y, w, d, h) => { const k = h * 0.7; api.poly([[x, y + d, 0.01], [x + w, y + d, 0.01], [x + w + k, y + d + k * 0.35, 0.01], [x + k, y + d + k * 0.35, 0.01]], 'rgba(0,0,0,.28)'); api.poly([[x + w, y, 0.01], [x + w + k, y + k * 0.35, 0.01], [x + w + k, y + d + k * 0.35, 0.01], [x + w, y + d, 0.01]], 'rgba(0,0,0,.28)'); },
    caixa: (x, y, z, w, d, h, cores, extra = '') => {
      const [topo, esq, dir] = typeof cores === 'string' ? faces(cores) : cores;
      api.poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], esq, extra);
      api.poly([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], dir, extra);
      api.poly([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], topo, extra);
    },
    // Edifício com janelas nas duas fachadas visíveis e equipamento no telhado.
    edificio: (x, y, w, d, andares, cor, janela = '#9fd3f0') => {
      const h = andares * 4.2; api.sombra(x, y, w, d, h); api.caixa(x, y, 0, w, d, h, cor);
      for (let a = 0; a < andares; a++) {
        for (let k = 1.5; k < w - 2; k += 3.4) api.plano(0, 0, 0, 0, 0, 'none') , api.poly([[x + k, y + d + 0.05, a * 4.2 + 1.2], [x + k + 2, y + d + 0.05, a * 4.2 + 1.2], [x + k + 2, y + d + 0.05, a * 4.2 + 3.1], [x + k, y + d + 0.05, a * 4.2 + 3.1]], janela, 'opacity=".85"');
        for (let k = 1.5; k < d - 2; k += 3.4) api.poly([[x + w + 0.05, y + k, a * 4.2 + 1.2], [x + w + 0.05, y + k + 2, a * 4.2 + 1.2], [x + w + 0.05, y + k + 2, a * 4.2 + 3.1], [x + w + 0.05, y + k, a * 4.2 + 3.1]], tom(janela, -0.15), 'opacity=".85"');
      }
      api.caixa(x + 2, y + 2, h, 4, 3, 1.6, '#b9bec6'); if (w > 14) api.caixa(x + w - 7, y + d - 6, h, 4, 4, 1.2, '#a3a9b2');
    },
    relvado: (x, y, w, d, opts = {}) => {
      const n = opts.riscas ?? 12;
      api.plano(x - 3, y - 3, w + 6, d + 6, 0.02, '#3d7a44');
      for (let k = 0; k < n; k++) api.poly([[x + (w * k) / n, y, 0.04], [x + (w * (k + 1)) / n, y, 0.04], [x + (w * (k + 1)) / n, y + d, 0.04], [x + (w * k) / n, y + d, 0.04]], k % 2 ? '#47a052' : '#53b05d');
      // Corte cruzado (xadrez subtil).
      const m = Math.max(3, Math.round(n * d / w));
      for (let k = 0; k < m; k += 2) api.poly([[x, y + (d * k) / m, 0.05], [x + w, y + (d * k) / m, 0.05], [x + w, y + (d * (k + 1)) / m, 0.05], [x, y + (d * (k + 1)) / m, 0.05]], 'rgba(255,255,255,.05)');
      const L = (a, b) => api.line([a[0], a[1], 0.1], [b[0], b[1], 0.1], 'rgba(255,255,255,.92)', 0.8);
      const r = (x0, y0, x1, y1) => { L([x0, y0], [x1, y0]); L([x1, y0], [x1, y1]); L([x1, y1], [x0, y1]); L([x0, y1], [x0, y0]); };
      const mg = 1.5;
      r(x + mg, y + mg, x + w - mg, y + d - mg); L([x + w / 2, y + mg], [x + w / 2, y + d - mg]);

    el.innerHTML = `<div class="modal" role="dialog" aria-label="Calendário" style="width:min(960px,100%)"><div class="modal-cab"><button class="icone-btn" id="cal-ant" aria-label="Mês anterior" style="transform:scaleX(-1)">${svg('seta')}</button><h3>${MESES[base.getUTCMonth()]} ${base.getUTCFullYear()}</h3><button class="icone-btn" id="cal-seg" aria-label="Mês seguinte">${svg('seta')}</button><button class="btn" id="fechar">Fechar</button></div>
      <div class="cal">${['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map((x) => `<div class="dsem">${x}</div>`).join('')}${cel}</div>
      <div class="legenda"><span><i class="ci" style="background:var(--c-liga)">${svg('liga')}</i>Liga</span><span><i class="ci" style="background:var(--c-taca)">${svg('taca')}</i>Taça</span><span><i class="ci" style="background:var(--c-ucl)">${svg('cont')}</i>Liga dos Campeões / Libertadores / AFC Champions</span><span><i class="ci" style="background:var(--c-uel)">${svg('cont')}</i>Liga Europa</span><span><i class="ci" style="background:var(--c-uecl)">${svg('cont')}</i>Liga Conferência</span><span><i class="ci" style="background:var(--c-pausa)"></i>Pausas</span><span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--aviso)" stroke-width="2.4" stroke-linecap="round"><path d="M4 9h13l-3-3M20 15H7l3 3"/></svg>Janela de transferências aberta</span></div>
      <div class="rot" style="margin-top:8px">Hoje: ${fmtData(hoje)}</div></div>`;
  } else {
    el.innerHTML = `<div class="modal" role="dialog" aria-label="Mensagens"><div class="modal-cab"><h3>Mensagens</h3><button class="btn" id="fechar">Fechar</button></div>${MENSAGENS.map((x, i) => `<div class="msg ${x.lida ? 'lida' : ''}" data-msg="${i}"><span class="nl"></span><div><b>${x.assunto}</b><div class="de">${x.de}</div><div style="margin-top:4px">${x.txt}</div></div><span class="de">${x.dia}</span></div>`).join('')}</div>`;
  }
  document.body.appendChild(el);
  el.addEventListener('click', (e) => { if (e.target === el) { modal = null; desenhar(); } });
  el.querySelector('#fechar').addEventListener('click', () => { modal = null; mesCal = null; desenhar(); });
  const mv = (dm) => { const b = mesCal ?? new Date(Date.UTC(hoje.getUTCFullYear(), hoje.getUTCMonth(), 1)); mesCal = new Date(Date.UTC(b.getUTCFullYear(), b.getUTCMonth() + dm, 1)); desenharModal(); };
  el.querySelector('#cal-ant')?.addEventListener('click', () => mv(-1));
  el.querySelector('#cal-seg')?.addEventListener('click', () => mv(1));
  el.querySelectorAll('[data-msg]').forEach((x) => x.addEventListener('click', () => { MENSAGENS[+x.dataset.msg].lida = true; desenharModal(); const b = document.querySelector('#b-msg .badge'); const n = MENSAGENS.filter((y) => !y.lida).length; if (b) { if (n) b.textContent = n; else b.remove(); } }));
}
function ligar(m) {

  m.querySelector('#b-msg').addEventListener('click', () => { modal = 'msg'; desenharModal(); });

  const f = m.querySelector('#f-pesq'); if (f) f.addEventListener('input', () => { pesquisa = f.value; const pos = f.selectionStart; desenhar(); const g = document.getElementById('f-pesq'); g.focus(); g.setSelectionRange(pos, pos); });
  m.querySelectorAll('[data-jj]').forEach((t) => t.addEventListener('click', () => { jogadorSel = +t.dataset.jj; location.hash = 'jogador'; }));
  m.querySelectorAll('.dl[data-j]').forEach((t) => t.addEventListener('click', () => { jogadorSel = +t.dataset.j; location.hash = 'jogador'; }));
  m.querySelectorAll('.lin-j[data-j]').forEach((t) => t.addEventListener('click', () => { jogadorSel = +t.dataset.j; location.hash = 'jogador'; }));
  m.querySelectorAll('tr[data-j]').forEach((t) => t.addEventListener('click', () => { jogadorSel = +t.dataset.j; location.hash = 'jogador'; }));
  m.querySelectorAll('[data-ver]').forEach((b) => b.addEventListener('click', () => { verComo = b.dataset.ver; desenhar(); }));
  m.querySelectorAll('[data-form]').forEach((b) => b.addEventListener('click', () => { formacao = b.dataset.form; desenhar(); }));
  m.querySelectorAll('[data-ment]').forEach((b) => b.addEventListener('click', () => { mentalidade = b.dataset.ment; desenhar(); }));
  m.querySelectorAll('[data-tab], #ver-tab').forEach((x) => x.addEventListener('click', () => { compSel = 'POR1'; tabComp = 'Classificação'; location.hash = 'classificacao'; }));
  m.querySelector('#ver-fin')?.addEventListener('click', () => { location.hash = 'financas'; });
  m.querySelector('#ver-obj')?.addEventListener('click', () => { location.hash = 'financas'; });
  m.querySelector('#ver-cal')?.addEventListener('click', () => { modal = 'cal'; mesCal = null; desenharModal(); });
  m.querySelectorAll('[data-tabp]').forEach((b) => b.addEventListener('click', () => { tabPlantel = b.dataset.tabp; desenhar(); }));
  m.querySelectorAll('[data-ala]').forEach((b) => b.addEventListener('click', () => { alaAcad = b.dataset.ala; desenhar(); }));
  m.querySelectorAll('[data-prev]').forEach((b) => b.addEventListener('click', () => { const [k, v] = b.dataset.prev.split(':'); previa[k] = +v; desenhar(); }));
  m.querySelector('#sel-tam')?.addEventListener('change', (e) => { tamClube = +e.target.value; desenhar(); });
  m.querySelectorAll('[data-tabe]').forEach((b) => b.addEventListener('click', () => { tabEst = b.dataset.tabe; desenhar(); }));
  m.querySelectorAll('[data-tabc]').forEach((b) => b.addEventListener('click', () => { tabComp = b.dataset.tabc; desenhar(); }));
  const sc = m.querySelector('#sel-comp'); if (sc) sc.addEventListener('change', () => { compSel = sc.value; if (['UCL', 'UEL', 'UECL'].includes(compSel) && tabComp === 'Classificação') tabComp = 'Histórico de campeões'; desenhar(); });
  m.querySelectorAll('[data-mover]').forEach((b) => b.addEventListener('click', (ev) => { ev.stopPropagation(); const [de, id, para] = b.dataset.mover.split(':');
    let p;
    if (de === 'principal') { const i = plantel.findIndex((x) => x.n === +id); p = plantel.splice(i, 1)[0]; }
    else p = (de === 'sub21' ? sub21 : sub18).splice(+id, 1)[0];
    if (para === 'principal') plantel.push({ ...p, n: plantel.length + 1, moral: 14, cond: 95, forma: ['6.8', '7.0', '6.9', '7.1', '7.0'], adq: 12, papel: PAPEIS[p.pos][0], fim: 2029, sal: 30000, lesao: '', susp: false });
    else (para === 'sub21' ? sub21 : sub18).unshift(p);
    desenhar(); }));
  m.querySelector('#sel-parc')?.addEventListener('change', (e) => { parcelas = e.target.value; desenhar(); });
  m.querySelectorAll('[data-tabm]').forEach((b) => b.addEventListener('click', () => { tabMercado = b.dataset.tabm; desenhar(); }));
  m.querySelector('#demo-pos')?.addEventListener('click', () => { const i = tabela.findIndex((t) => t.nome === CLUBE.nome); const [t] = tabela.splice(i, 1); const alvo = i === 13 ? 2 : 13; Object.assign(t, alvo === 13 ? { v: 3, e: 4, d: 5, gm: 13, gs: 16, pts: 13 } : { v: 9, e: 2, d: 1, gm: 21, gs: 7, pts: 29 }); tabela.splice(alvo, 0, t); desenhar(); });
  m.querySelectorAll('[data-cor]').forEach((b) => b.addEventListener('click', () => { CLUBE.cores = [b.dataset.cor, b.dataset.cor2]; CORES[3] = CLUBE.cores; tabela.forEach((t) => { if (t.nome === CLUBE.nome) t.cores = CLUBE.cores; }); acento(); desenhar(); }));
}
function acento() {
  document.documentElement.style.setProperty('--acento', CLUBE.cores[0]);
  document.documentElement.style.setProperty('--acento-2', CLUBE.cores[1]);
  document.getElementById('escudo-marca').outerHTML = escudo(CLUBE.cores).replace('class="escudo"', 'class="escudo" id="escudo-marca"');
}
window.addEventListener('hashchange', desenhar);
acento();
desenhar();
</script>
