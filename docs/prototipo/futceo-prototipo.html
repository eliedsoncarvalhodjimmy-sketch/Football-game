<style>
/* Disposição: barra lateral (tablet) / barra inferior (telemóvel) + área de cartões; números grandes condensados; acento = cor do clube. */
:root {
  --fundo: #0b0d10;
  --cartao: #16191e;
  --cartao-2: #1d2128;
  --linha: #2a2f38;
  --texto: #e8eaee;
  --suave: #9097a3;
  --fraco: #5f6672;
  --acento: #d63a3a;
  --acento-2: #f1f1f1;
  --bom: #3fb67a;
  --aviso: #e2a33a;
  --mau: #e0565b;
  --info: #5a9be0;
  --f-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-texto: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-dados: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  --raio: 12px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--fundo); color: var(--texto); font-family: var(--f-texto); font-size: 14px; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
.lateral { background: #0f1216; border-right: 1px solid var(--linha); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; overflow-y: auto; }
.marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.marca b { font-family: var(--f-num); font-size: 24px; letter-spacing: .5px; }
.marca small { display: block; color: var(--suave); font-size: 11px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--suave); text-decoration: none; font-weight: 500; }
.nav:hover { background: var(--cartao); color: var(--texto); }
.nav.activo { background: var(--cartao-2); color: var(--texto); box-shadow: inset 3px 0 0 var(--acento); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav-sep { height: 1px; background: var(--linha); margin: 10px 4px; }

.principal { overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; min-width: 0; }
.topo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px; }
.topo h1 { font-family: var(--f-num); font-weight: 600; font-size: 30px; margin: 0; letter-spacing: .3px; text-wrap: balance; }
.topo .sub { color: var(--suave); }
.topo .direita { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--cartao-2); color: var(--suave); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.bom { color: var(--bom); } .chip.aviso { color: var(--aviso); } .chip.mau { color: var(--mau); } .chip.info { color: var(--info); }
.chip .pt { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.btn { border: 1px solid var(--linha); background: var(--cartao-2); padding: 8px 14px; border-radius: 10px; font-weight: 600; min-height: 40px; }
.btn.prim { background: var(--acento); border-color: var(--acento); color: var(--acento-2); }
.btn:hover { border-color: var(--suave); }

.grelha { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.c { background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; min-width: 0; }
.c h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--suave); margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.c h2 .acao { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--acento); font-weight: 600; cursor: pointer; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.num { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.grande { font-size: 40px; line-height: 1; }
.medio { font-size: 26px; line-height: 1; }
.rot { color: var(--suave); font-size: 12px; }
.muted { color: var(--suave); }
.linha-kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--linha); }
.linha-kv:last-child { border-bottom: 0; }
.linha-kv span:last-child { font-variant-numeric: tabular-nums; }

.escudo { width: 34px; height: 38px; flex: none; }
.forma { display: inline-flex; gap: 4px; }
.forma i { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; color: #0b0d10; }
.forma .V { background: var(--bom); } .forma .E { background: #8a919c; } .forma .D { background: var(--mau); }

.proximo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.equipa { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 110px; text-align: center; }

.vs { text-align: center; }

.tab-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--fraco); font-weight: 600; padding: 8px 8px; border-bottom: 1px solid var(--linha); white-space: nowrap; position: sticky; top: 0; background: var(--cartao); }
td { padding: 9px 8px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
tr.clic { cursor: pointer; } tr.clic:hover td { background: var(--cartao-2); }
tr.meu td { background: color-mix(in srgb, var(--acento) 16%, transparent); }
td.r, th.r { text-align: right; }
.ovr { display: inline-grid; place-items: center; min-width: 34px; height: 26px; border-radius: 7px; font-family: var(--f-num); font-weight: 700; font-size: 17px; background: var(--cartao-2); }
.ovr.a { color: #7fe0a5; } .ovr.b { color: #c9e27a; } .ovr.c { color: #e8c46a; } .ovr.d { color: #e69a6a; }
.intervalo { font-family: var(--f-dados); font-size: 12px; color: var(--aviso); }
.barra { height: 6px; border-radius: 3px; background: var(--cartao-2); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--acento); }
.zona { width: 3px; padding: 0; }
.zona.ucl { background: var(--info); } .zona.uel { background: var(--aviso); } .zona.desc { background: var(--mau); }

.filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filtros input, .filtros select { background: var(--cartao-2); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 12px; min-height: 40px; }
.filtros input { flex: 1; min-width: 180px; }
.seg { display: inline-flex; background: var(--cartao-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; color: var(--suave); font-weight: 600; min-height: 34px; }
.seg button.on { background: var(--cartao); color: var(--texto); }

.jogador-topo { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.dorsal { width: 64px; height: 64px; border-radius: 50%; background: var(--acento); color: var(--acento-2); display: grid; place-items: center; font-family: var(--f-num); font-size: 30px; font-weight: 700; flex: none; }
.estrelas { color: var(--aviso); letter-spacing: 2px; font-size: 15px; }
.atrib { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.atrib .v { font-family: var(--f-num); font-size: 18px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.v20 { color: #7fe0a5; } .v15 { color: #c9e27a; } .v10 { color: var(--texto); } .v5 { color: #e69a6a; }
.papeis { display: grid; gap: 8px; }
.papel { display: grid; grid-template-columns: 1fr 120px 28px; align-items: center; gap: 10px; }

.campo { position: relative; aspect-ratio: 68/100; max-width: 420px; width: 100%; margin: 0 auto; border-radius: 10px; overflow: hidden;
  background: repeating-linear-gradient(0deg, #1f5a35 0 9%, #23633b 9% 18%); border: 2px solid #2e7a4a; }
.campo .lin { position: absolute; border: 2px solid rgba(255,255,255,.35); }
.peca { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: 3px; width: 90px; }
.peca b { width: 34px; height: 34px; border-radius: 50%; background: var(--acento); color: var(--acento-2); display: grid; place-items: center; font-family: var(--f-num); font-size: 16px; border: 2px solid rgba(255,255,255,.7); }
.peca span { font-size: 11px; font-weight: 600; text-shadow: 0 1px 2px #000; white-space: nowrap; }
.peca em { font-style: normal; font-size: 10px; color: #cfe8d6; text-shadow: 0 1px 2px #000; }
.instr { display: grid; gap: 12px; }
.instr label { display: grid; gap: 6px; color: var(--suave); font-size: 12px; }

.barras-fin { display: grid; gap: 10px; }
.bf { display: grid; grid-template-columns: 130px 1fr 80px; align-items: center; gap: 10px; }
.bf .t { height: 14px; border-radius: 4px; background: var(--cartao-2); overflow: hidden; }
.bf .t i { display: block; height: 100%; }

.janela { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--aviso) 14%, var(--cartao)); border: 1px solid color-mix(in srgb, var(--aviso) 45%, transparent); }
.ronda { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
.ronda:last-child { border-bottom: 0; }

.aviso-proto { font-size: 12px; color: var(--fraco); margin-top: 18px; }
.cores { display: inline-flex; gap: 6px; }
.cores button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--linha); }

.inferior { display: none; }
@media (max-width: 1100px) { .s3 { grid-column: span 6; } .s4 { grid-column: span 6; } .s5, .s7, .s8 { grid-column: span 12; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .lateral { display: none; }
  .principal { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .s3, .s4, .s6 { grid-column: span 12; }
  .inferior { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: #0f1216; border-top: 1px solid var(--linha);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); justify-content: space-around; z-index: 5; }
  .inferior a { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--suave); text-decoration: none; font-size: 10px; padding: 6px 4px; min-width: 52px; border-radius: 8px; }
  .inferior a.activo { color: var(--texto); }
  .inferior a.activo svg { color: var(--acento); }
  .inferior svg { width: 20px; height: 20px; }
  .grande { font-size: 34px; }
  .papel { grid-template-columns: 1fr 80px 28px; }
  .bf { grid-template-columns: 100px 1fr 70px; }
}
</style>

<script>
// ---------- dados fictícios (protótipo) ----------
const ICON = {
  inicio: '<path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  plantel: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/>',
  jogador: '<circle cx="12" cy="7" r="3.5"/><path d="M5 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/>',
  tactica: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/><circle cx="12" cy="12" r="3"/>',
  mercado: '<path d="M4 7h16l-1.5 12h-13z"/><path d="M8 7a4 4 0 0 1 8 0"/>',
  financas: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  classificacao: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>',
};
const ECRAS = [['inicio', 'Início'], ['plantel', 'Plantel'], ['jogador', 'Jogador'], ['tactica', 'Táctica'], ['mercado', 'Mercado'], ['financas', 'Finanças'], ['classificacao', 'Classificação']];
const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

let sem = 2026;
const rnd = () => { sem = (sem * 1103515245 + 12345) % 2147483648; return sem / 2147483648; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

const CLUBE = { nome: 'Atlético de Serra do Freixo', curto: 'Serra do Freixo', liga: 'Liga Portugal (POR1)', cores: ['#d63a3a', '#f1f1f1'] };
const PRIMEIROS = ['Rafael', 'Diogo', 'Pedro', 'Tiago', 'João', 'Miguel', 'Gonçalo', 'Nuno', 'Vasco', 'André', 'Bruno', 'Luís', 'Rúben', 'Kevin', 'Mateus', 'Hugo', 'Ivo', 'Samuel'];
const APELIDOS = ['Salouro', 'Teiouro', 'Corança', 'Marota', 'Barouro', 'Valota', 'Tavouro', 'Gouilho', 'Barota', 'Salares', 'Marouro', 'Teieira', 'Ferrão', 'Alcobia', 'Quintela', 'Rebordão', 'Seixal', 'Lourosa', 'Amieira', 'Carvide'];
const POS = ['GR', 'GR', 'GR', 'DC', 'DC', 'DC', 'DC', 'DD', 'DD', 'DE', 'DE', 'MDC', 'MDC', 'MC', 'MC', 'MC', 'MC', 'MO', 'MO', 'ED', 'EE', 'ED', 'PL', 'PL', 'PL'];
const PAPEIS = { GR: ['Guarda-redes', 'Guarda-redes líbero'], DC: ['Defesa central', 'Central construtor', 'Central de marcação'], DD: ['Lateral', 'Lateral ofensivo', 'Ala'], DE: ['Lateral', 'Lateral ofensivo', 'Ala'], MDC: ['Trinco', 'Médio recuperador', 'Pivô construtor'], MC: ['Médio box-to-box', 'Médio organizador', 'Médio de cobertura'], MO: ['Médio ofensivo', 'Segundo avançado', 'Falso 10'], ED: ['Extremo', 'Extremo invertido', 'Avançado interior'], EE: ['Extremo', 'Extremo invertido', 'Avançado interior'], PL: ['Ponta de lança', 'Avançado móvel', 'Pivô'] };
const PAISES = ['POR', 'POR', 'POR', 'POR', 'BRA', 'BRA', 'CPV', 'ARG', 'ANG', 'ESP', 'URU'];
const plantel = POS.map((p, k) => {
  const idade = ri(18, 34);
  const ovr = Math.max(48, Math.min(78, 64 + ri(-8, 9) - (k % 4 === 3 ? 6 : 0)));
  const pot = Math.min(92, ovr + (idade < 23 ? ri(4, 14) : ri(0, 3)));
  return { n: k + 1, nome: `${PRIMEIROS[ri(0, PRIMEIROS.length - 1)]} ${APELIDOS[ri(0, APELIDOS.length - 1)]}`, pos: p, idade, ovr, pot, pais: PAISES[ri(0, PAISES.length - 1)],
    moral: ri(8, 19), cond: ri(72, 100), forma: Array.from({ length: 5 }, () => (rnd() * 3 + 5.6).toFixed(1)), adq: ri(11, 18), papel: PAPEIS[p][ri(0, PAPEIS[p].length - 1)],
    fim: 2026 + ri(1, 5), sal: Math.round((ovr - 40) ** 2 * 380 / 1000) * 1000, lesao: k === 9 ? 'Entorse (12 dias)' : k === 20 ? 'Muscular (3 dias)' : '', susp: k === 14 };
});
plantel[22].nome = 'Rafael Salouro'; plantel[22].idade = 19; plantel[22].ovr = 69; plantel[22].pot = 84;
const nomeCurto = (n) => { const p = n.split(' '); return `${p[0][0]}. ${p[p.length - 1]}`; };

const LIGA = ['Real Montalvo', 'CF Alvarenga', 'Sporting de Vale Formoso', 'Atlético de Serra do Freixo', 'Desportivo das Lezírias', 'União de Rio Maior', 'Académico de Penedono', 'Vitória de Castro Marim', 'FC Barca de Marvila', 'Clube Naval da Foz', 'Estrela de Valongo', 'Juventude de Arouca', 'Boavista do Mondego', 'SC Ribeira Brava', 'Os Lusitanos de Ourém', 'Marítimo da Amieira', 'GD Penafiel Velho', 'Recreativo de Tondela'];
const CORES = [['#2c63c9', '#fff'], ['#2b8a4b', '#fff'], ['#1d9a6c', '#fff'], CLUBE.cores, ['#e2a33a', '#111'], ['#7a3cc7', '#fff'], ['#111', '#fff'], ['#c43b7a', '#fff'], ['#3aa0c7', '#111'], ['#1d3b6b', '#e2a33a'], ['#a12a2a', '#111'], ['#2a7a2a', '#e8e8e8'], ['#222', '#d63a3a'], ['#d6743a', '#fff'], ['#5a5a9a', '#fff'], ['#2a6a6a', '#fff'], ['#9a2a5a', '#fff'], ['#3a7a3a', '#111']];
const tabela = LIGA.map((nome, i) => { const j = 12; const v = Math.max(0, 9 - Math.floor(i / 2) + ri(-1, 1)); const e = ri(1, 4); const d = j - v - e; const gm = v * 2 + e + ri(0, 4), gs = d * 2 + e + ri(0, 3); return { nome, cores: CORES[i], j, v, e, d: Math.max(0, d), gm, gs, pts: v * 3 + e, forma: Array.from({ length: 5 }, () => 'VVEDV'[ri(0, 4)]) }; }).sort((a, b) => b.pts - a.pts || (b.gm - b.gs) - (a.gm - a.gs));

const MERCADO = [
  ['Thanasis Kostopoulos', 'MC', 25, 'Asteras Thalassopyrgos', 'GRE1', 40, [63, 85], [74, 96], 3.1],
  ['Antoine Bouon', 'ED', 28, 'Asteras Oristathmos', 'GRE1', 37, [65, 87], [74, 99], 4.6],
  ['Yusuf Taşsoy', 'MO', 23, 'Kızılpınarspor', 'TUR1', 93, [71, 75], [74, 86], 6.8],

  ['Erik Holmsen', 'DC', 23, 'AC Vestersted', 'DEN1', 35, [62, 86], [63, 84], 1.9],
  ['Can Demirlik', 'MDC', 27, 'Kızılpınarspor', 'TUR1', 97, [77, 79], [80, 86], 9.5],
  ['Loon Ji-sung', 'DE', 26, 'Kalalimni FC', 'GRE1', 69, [67, 79], [69, 83], 1.4],
  ['Gustavo Rosilho', 'PL', 20, 'Atlético Pouso das Pedras', 'BRA1', 82, [73, 81], [87, 99], 14.0],
];

// ---------- utilitários ----------
const corOvr = (o) => (o >= 75 ? 'a' : o >= 68 ? 'b' : o >= 60 ? 'c' : 'd');
const M = (v) => (v >= 1e6 ? `${(v / 1e6).toFixed(1).replace('.', ',')} M€` : `${Math.round(v / 1000)} mil €`);
const escudo = (cores, w = 34) => `<svg class="escudo" viewBox="0 0 34 38" width="${w}" aria-hidden="true"><path d="M17 1 L32 6 V18 C32 28 25 34 17 37 C9 34 2 28 2 18 V6 Z" fill="${cores[0]}" stroke="${cores[1]}" stroke-width="2"/><path d="M17 1 V37" stroke="${cores[1]}" stroke-width="5" opacity=".55"/></svg>`;
const estrelas = (a, b) => { const s = (x) => '★'.repeat(Math.floor(x)) + (x % 1 ? '½' : ''); return a === b ? s(a) : `${s(a)}–${s(b)}`; };
const potE = (p) => Math.max(0.5, Math.min(5, Math.round(((p - 40) / 12) * 2) / 2));

// ---------- ecrãs ----------
function inicio() {
  const pos = tabela.findIndex((t) => t.nome === CLUBE.nome) + 1;
  return `
  <div class="topo"><h1>Início</h1><span class="sub">Época 2026/27 · Jornada 13</span><div class="direita"><span class="chip info"><span class="pt"></span>Janela fechada · abre a 1 de Janeiro</span><button class="btn prim">Avançar para o jogo</button></div></div>
  <div class="grelha">
    <section class="c s8"><h2>Próximo jogo<span class="acao">Pré-jogo</span></h2>

// ---------- navegação e acento ----------
const RENDER = { inicio, plantel: plantelEcra, jogador: jogadorEcra, tactica: tacticaEcra, mercado: mercadoEcra, financas: financasEcra, classificacao: classificacaoEcra };
function rota() { const h = location.hash.replace('#', ''); return RENDER[h] ? h : 'inicio'; }
function desenhar() {
  const r = rota();
  document.getElementById('nav-lista').innerHTML = ECRAS.map(([k, t]) => `<a class="nav ${k === r ? 'activo' : ''}" href="#${k}">${svg(k)}${t}</a>`).join('');
  document.getElementById('inferior').innerHTML = ECRAS.filter(([k]) => k !== 'jogador').map(([k, t]) => `<a class="${k === r ? 'activo' : ''}" href="#${k}">${svg(k)}${t}</a>`).join('');
  const m = document.getElementById('principal');
  m.innerHTML = RENDER[r]() + `<div class="aviso-proto">Protótipo com dados fictícios do mundo gerado. Cor do clube (acento): <span class="cores">${[['#d63a3a', '#f1f1f1'], ['#2c63c9', '#ffffff'], ['#1d9a6c', '#ffffff'], ['#e2a33a', '#111111'], ['#7a3cc7', '#ffffff']].map((c) => `<button data-cor="${c[0]}" data-cor2="${c[1]}" style="background:${c[0]}" aria-label="Acento ${c[0]}"></button>`).join('')}</span></div>`;
  ligar(m);
}
function ligar(m) {
  m.querySelectorAll('[data-pos]').forEach((b) => b.addEventListener('click', () => { filtroPos = b.dataset.pos; desenhar(); }));
  const f = m.querySelector('#f-pesq'); if (f) f.addEventListener('input', () => { pesquisa = f.value; const pos = f.selectionStart; desenhar(); const g = document.getElementById('f-pesq'); g.focus(); g.setSelectionRange(pos, pos); });
  m.querySelectorAll('tr[data-j]').forEach((t) => t.addEventListener('click', () => { jogadorSel = +t.dataset.j; location.hash = 'jogador'; }));
  m.querySelectorAll('[data-ver]').forEach((b) => b.addEventListener('click', () => { verComo = b.dataset.ver; desenhar(); }));
  m.querySelectorAll('[data-ment]').forEach((b) => b.addEventListener('click', () => { mentalidade = b.dataset.ment; desenhar(); }));
  m.querySelectorAll('[data-tabm]').forEach((b) => b.addEventListener('click', () => { tabMercado = b.dataset.tabm; desenhar(); }));
  m.querySelectorAll('[data-cor]').forEach((b) => b.addEventListener('click', () => { CLUBE.cores = [b.dataset.cor, b.dataset.cor2]; CORES[3] = CLUBE.cores; tabela.forEach((t) => { if (t.nome === CLUBE.nome) t.cores = CLUBE.cores; }); acento(); desenhar(); }));
}
function acento() {
  document.documentElement.style.setProperty('--acento', CLUBE.cores[0]);
  document.documentElement.style.setProperty('--acento-2', CLUBE.cores[1]);
  document.getElementById('escudo-marca').outerHTML = escudo(CLUBE.cores).replace('class="escudo"', 'class="escudo" id="escudo-marca"');
}
