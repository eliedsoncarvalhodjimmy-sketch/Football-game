<title>FutCEO Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Disposição: barra lateral (tablet) / barra inferior (telemóvel) + área de cartões; números grandes condensados; acento = cor do clube. */
:root {
  --fundo: #0b0d10;
  --cartao: #16191e;
  --cartao-2: #1d2128;
  --linha: #2a2f38;
  --texto: #e8eaee;
  --suave: #9097a3;
  --fraco: #5f6672;
  --acento: #d63a3a;
  --acento-2: #f1f1f1;
  --bom: #3fb67a;
  --aviso: #e2a33a;
  --mau: #e0565b;
  --info: #5a9be0;
  --c-liga: #e0565b; --c-taca: #9aa1ab; --c-ucl: #4a86e8; --c-uel: #f2b632; --c-uecl: #3fb67a; --c-pausa: #d9c49a;
  --f-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-texto: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-dados: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  --raio: 12px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--fundo); color: var(--texto); font-family: var(--f-texto); font-size: 14px; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
.lateral { background: #0f1216; border-right: 1px solid var(--linha); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; overflow-y: auto; }
.marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.marca b { font-family: var(--f-num); font-size: 24px; letter-spacing: .5px; }
.marca small { display: block; color: var(--suave); font-size: 11px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--suave); text-decoration: none; font-weight: 500; }
.nav:hover { background: var(--cartao); color: var(--texto); }
.nav.activo { background: var(--cartao-2); color: var(--texto); box-shadow: inset 3px 0 0 var(--acento); }
.nav svg { width: 18px; height: 18px; flex: none; }

.principal { overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; min-width: 0; }
.topo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px; }
.topo h1 { font-family: var(--f-num); font-weight: 600; font-size: 30px; margin: 0; letter-spacing: .3px; text-wrap: balance; }
.topo .sub { color: var(--suave); }
.topo .direita { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--cartao-2); color: var(--suave); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.bom { color: var(--bom); } .chip.aviso { color: var(--aviso); } .chip.mau { color: var(--mau); } .chip.info { color: var(--info); }
.chip .pt { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.btn { border: 1px solid var(--linha); background: var(--cartao-2); padding: 8px 14px; border-radius: 10px; font-weight: 600; min-height: 40px; }
.btn.prim { background: var(--acento); border-color: var(--acento); color: var(--acento-2); }
.btn:hover { border-color: var(--suave); }

.grelha { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.c { background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; min-width: 0; }
.c h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--suave); margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.c h2 .acao { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--acento); font-weight: 600; cursor: pointer; }
.s9 { grid-column: span 9; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.num { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.grande { font-size: 40px; line-height: 1; }
.medio { font-size: 26px; line-height: 1; }

.muted { color: var(--suave); }
.linha-kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--linha); }
.linha-kv:last-child { border-bottom: 0; }

.escudo { width: 34px; height: 38px; flex: none; }
.forma { display: inline-flex; gap: 4px; }
.forma i { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; color: #0b0d10; }
.forma .V { background: var(--bom); } .forma .E { background: #8a919c; } .forma .D { background: var(--mau); }

.proximo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.tab-wrap { overflow-x: auto; }

.ovr.qa { color: #7fe0a5; } .ovr.qb { color: #c9e27a; } .ovr.qc { color: #e8c46a; } .ovr.qd { color: #e69a6a; }
.intervalo { font-family: var(--f-dados); font-size: 12px; color: var(--aviso); }
.barra { height: 6px; border-radius: 3px; background: var(--cartao-2); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--acento); }
.zona { width: 3px; padding: 0; }
.zona.ucl { background: var(--info); } .zona.uel { background: var(--aviso); } .zona.desc { background: var(--mau); }

.filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filtros input, .filtros select { background: var(--cartao-2); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 12px; min-height: 40px; }

.jogador-topo { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }

.estrelas { color: var(--aviso); letter-spacing: 2px; font-size: 15px; }

.atrib .v { font-family: var(--f-num); font-size: 18px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

.papeis { display: grid; gap: 8px; }

.campo { position: relative; aspect-ratio: 68/100; max-width: 420px; width: 100%; margin: 0 auto; border-radius: 10px; overflow: hidden;
  background: repeating-linear-gradient(0deg, #1f5a35 0 9%, #23633b 9% 18%); border: 2px solid #2e7a4a; }

.janela { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--aviso) 14%, var(--cartao)); border: 1px solid color-mix(in srgb, var(--aviso) 45%, transparent); }

.bm-topo { position: absolute; left: 16px; top: 12px; z-index: 1; }

.bm-contagem { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 22px; border-radius: 14px; background: rgba(11,13,16,.62); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,.12); text-align: center; }

@media (max-width: 760px) { .banner-mercado { aspect-ratio: 588/330; } .bm-dias { font-size: 42px; } .bm-topo h1 { font-size: 24px; } .bm-topo span { display: none; } }
.barra-topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0 14px; margin-bottom: 14px; border-bottom: 1px solid var(--linha); }
.data { display: flex; flex-direction: column; line-height: 1.15; }

.data span { color: var(--suave); font-size: 12px; }
.icone-btn { position: relative; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--linha); background: var(--cartao-2); display: grid; place-items: center; }

.negociacao { padding: 12px; }
.sel-comp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-bottom: 12px; }
.sel-am { min-width: 0; position: relative; display: flex; align-items: center; gap: 8px; background: #f2c230; color: #111; border-radius: 8px; padding: 0 12px; min-height: 46px; font-weight: 600; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.sel-am select { min-width: 0; text-overflow: ellipsis; appearance: none; -webkit-appearance: none; background: transparent; border: 0; color: #111; font: inherit; flex: 1; min-height: 44px; padding-right: 22px; cursor: pointer; }

.sel-am .ci, .tl-zi .ci { flex: none; width: 22px; height: 22px; border-radius: 5px; display: inline-grid; place-items: center; color: #0b0d10; } .sel-am .ci svg, .tl-zi .ci svg { width: 14px; height: 14px; }
.tl-zi .ci { width: 19px; height: 19px; } .tl-zi .ci svg { width: 12px; height: 12px; }

function filtroCorClube(fid, alfa) {
  const cor = CLUBE.cores[0];

  document.getElementById(`${fid}-cor`).setAttribute('flood-color', cor);
}

// Preço do bilhete (protótipo): procura com elasticidade; a satisfação reage a preços acima do de referência.
let precoBilhete = 24;
function efeitoBilhete(p) {
  const lugares = 32500, ref = 24;
  const ocup = Math.max(35, Math.min(99, Math.round(86 * Math.pow(ref / p, 0.55))));
  const assist = Math.round((lugares * ocup) / 100 / 50) * 50;
  const receita = Math.round(assist * p * 0.96);
  const satisf = Math.max(5, Math.min(95, Math.round(68 - (p - ref) * 1.4)));
  return { ocup, assist, receita, satisf };
}

  : '<rect width="30" height="20" fill="#003399"/>' + Array.from({ length: 12 }, (_, k) => `<circle cx="${(15 + 6 * Math.cos((k * Math.PI) / 6)).toFixed(1)}" cy="${(10 + 6 * Math.sin((k * Math.PI) / 6)).toFixed(1)}" r=".9" fill="#ffcc00"/>`).join('')}</svg>`;
const VISTAS_TAB = ['Tabela geral', 'Em casa', 'Fora'];
let vistaTab = 0;
function tabelaVista() {
  if (!vistaTab) return tabela;
  // Divisão casa/fora determinística a partir dos totais (no protótipo).
  return tabela.map((t, k) => {
    const casa = vistaTab === 1, f = (n, a) => (casa ? Math.ceil(n * a) : n - Math.ceil(n * a));
    const j = casa ? 6 : 6, v = f(t.v, 0.62), e = f(t.e, 0.5), d = Math.max(0, j - v - e), gm = f(t.gm, 0.58), gs = f(t.gs, 0.42);
    return { ...t, j, v, e, d, gm, gs, pts: v * 3 + e };
  }).sort((a, b) => b.pts - a.pts || (b.gm - b.gs) - (a.gm - a.gs));
}
function classificacaoEcra() {
  const nome = COMP.find((c) => c[0] === compSel)[1], pais = PAIS_COMP[compSel];
  const sels = `<div class="sel-comp">
    <label class="sel-am">${bandeira(pais)}<select id="sel-pais" aria-label="País">${PAISES_COMP.map(([k, n]) => `<option value="${k}" ${k === pais ? 'selected' : ''}>${n}</option>`).join('')}</select><span class="seta">▼</span></label>
    <label class="sel-am"><span class="ci" style="background:${pais === 'UEFA' ? 'var(--c-ucl)' : 'var(--c-liga)'}">${svg(pais === 'UEFA' ? 'cont' : COMP.find((c) => c[0] === compSel)[2] === 'taca' ? 'taca' : 'liga')}</span><select id="sel-comp" aria-label="Competição">${COMP.filter(([k]) => PAIS_COMP[k] === pais).map(([k, n]) => `<option value="${k}" ${k === compSel ? 'selected' : ''}>${n}</option>`).join('')}</select><span class="seta">▼</span></label></div>`;
  const cab = `<div class="topo"><h1>Competições</h1><span class="sub">${nome}</span></div>${sels}<div class="filtros"><div class="seg" role="group">${['Classificação', 'Estatísticas', 'Histórico de campeões', 'Prémios'].map((t) => `<button data-tabc="${t}" class="${t === tabComp ? 'on' : ''}">${t}</button>`).join('')}</div></div>`;
  if (tabComp === 'Histórico de campeões') return cab + `<div class="grelha">${historicoEcra()}</div>`;
  if (tabComp === 'Prémios') return cab + premiosEcra();
  if (tabComp === 'Estatísticas') return cab + (compSel === 'POR1' ? estatisticasEcra() : `<section class="c"><div class="rot">No protótipo só a Liga Portugal tem estatísticas; na app vêm do mundo simulado para todas as competições.</div></section>`);
  if (compSel !== 'POR1') return cab + `<section class="c"><div class="rot">Classificação de ${nome}: no protótipo só a Liga Portugal tem dados; na app vêm do mundo simulado (todas as ligas, taças e fases continentais).</div></section>`;
  const lista = tabelaVista(), n = lista.length;
  const zona = (i) => (i < 2 ? 'ucl' : i === 2 ? 'uel' : i === 3 ? 'uecl' : i >= n - 2 ? 'desc' : i === n - 3 ? 'playoff' : '');
  return cab + `
  <section class="tabela-liga">
    <div class="tl-linha tl-cab"><span class="tl-pos">Pos</span><span class="tl-clube"></span><span>J</span><span>V</span><span>E</span><span>D</span><span class="tl-g">GM</span><span class="tl-g">GS</span><span>DG</span><span class="tl-pts">Pts</span></div>
    ${lista.map((t, i) => { const z = zona(i); const dg = t.gm - t.gs; return `<div class="tl-linha ${t.nome === CLUBE.nome ? 'meu' : ''}"><span class="tl-pos z-${z || 'nada'}">${String(i + 1).padStart(2, '0')}</span><span class="tl-clube">${escudo(t.cores, 16)}<b>${t.nome}</b><span class="tl-zi">${z ? zonaSvg(z) : ''}</span></span><span>${t.j}</span><span>${t.v}</span><span>${t.e}</span><span>${t.d}</span><span class="tl-g">${t.gm}</span><span class="tl-g">${t.gs}</span><span>${dg > 0 ? '+' : dg < 0 ? '−' : ''}${Math.abs(dg)}</span><span class="tl-pts">${t.pts}</span></div>`; }).join('')}
  </section>
  <div class="tl-botoes"><button class="tl-btn" id="b-regras">Regras de transferência</button><button class="tl-btn" data-tabc="Histórico de campeões">Histórico</button><button class="tl-btn tl-ciclo" id="b-vista"><span>◂</span>${VISTAS_TAB[vistaTab]}<span>▸</span></button></div>
  <div class="legenda" style="margin-top:12px">${[['ucl', 'Liga dos Campeões'], ['uel', 'Liga Europa'], ['uecl', 'Liga Conferência'], ['playoff', 'Play-off de descida'], ['desc', 'Descida']].map(([z, t]) => `<span>${zonaSvg(z)}${t}</span>`).join('')}</div>`;
}

upo. Todos fizeram a sua parte e o resultado reflecte isso.","efeitos":{"EQ":1,"BL":1}},{"letra":"B","tom":"comedida","texto":"Foi um bom resultado, mas não vamos entusiasmar. O próximo jogo é outro desafio.","efeitos":{"TR":1}},{"letra":"C","tom":"provocadora","texto":"Há quem dissesse que não tínhamos qualidade. Hoje o campo respondeu.","efeitos":{"AD":1,"IM":-1,"EQ":1}}],"variaveis":[]},{"id":"IMP-016","titulo":"Vitória tardia","seccao":"Depois de vitórias","quando":"golo decisivo depois dos 85 minutos","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"O golo tardio salvou três pontos. Sente que a sorte esteve ao seu lado?","respostas":[{"letra":"A","tom":"humilde","texto":"Um pouco de sorte ajuda sempre. Mas persistimos até ao fim, e isso também conta.","efeitos":{"AD":1,"EQ":1}},{"letra":"B","tom":"orgulhosa","texto":"Sorte não: carácter. Este grupo nunca desiste.","efeitos":{"AD":2,"EQ":1,"BL":1}},{"letra":"C","tom":"honesta","texto":"Reconheço que não jogámos bem. Mas ganhar sem jogar bem é uma qualidade de campeão.","efeitos":{"IM":1,"TR":-1}}],"variaveis":[]},{"id":"IMP-017","titulo":"Sequência de vitórias","seccao":"Depois de vitórias","quando":"5 vitórias seguidas","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"Cinco vitórias seguidas. Já podemos sonhar com mais do que o objectivo inicial?","respostas":[{"letra":"A","tom":"sonhadora","texto":"Sonhar é de graça, mas só se ganha o próximo jogo. Estamos a viver um bom momento.","efeitos":{"AD":2,"EQ":1}},{"letra":"B","tom":"prudente","texto":"Tudo isso é prematuro. Vamos manter o foco e os pés assentes na terra.","efeitos":{"EQ":1,"DN":1,"TR":1}},{"letra":"C","tom":"firme","texto":"Sim, o novo objectivo é mais alto. Quero ver este grupo a lutar pelo título.","efeitos":{"AD":2,"EQ":1,"DN":-1},"promessa":"nova meta superior"}],"variaveis":[]},{"id":"IMP-018","titulo":"Título conquistado","seccao":"Depois de vitórias","quando":"o clube é c er.","efeitos":{"EQ":1,"BL":1}},{"letra":"C","tom":"reactiva","texto":"Não vou procurar culpados. A análise faz-se internamente, não nos jornais.","efeitos":{"AD":-1,"IM":-1}}],"variaveis":[]},{"id":"IMP-021","titulo":"Sequência negativa","seccao":"Depois de derrotas e empates","quando":"4 jogos sem vencer","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"Quatro jogos sem ganhar. O {treinador} está em risco?","respostas":[{"letra":"A","tom":"confiança","texto":"O treinador tem a minha confiança total. Nas más fases, é quando mais precisamos de estabilidade.","efeitos":{"TR":2,"DN":-1,"AD":-1},"notas":"(aumenta a pressão sobre o treinador)"},{"letra":"B","tom":"cautelosa","texto":"Estamos a analisar tudo, como em todas as fases. Não vou comentar situações individuais.","efeitos":{}},{"letra":"C","tom":"firme","texto":"Todos estão em avaliação, incluindo eu. Quem não render, sai.","efeitos":{"DN":1,"TR":-2,"EQ":-1,"BL":-1}}],"variaveis":["treinador"]},{"id":"IMP-022","titulo":"Derrota num derbi","seccao":"Depois de derrotas e empates","quando":"derrota contra {rival}","modo":"AMBOS","jornalista":"blogue de adeptos","tipoJornalista":"blogue","pergunta":"Perder o derbi é inaceitável. Os adeptos esperavam mais. O que lhes diz?","respostas":[{"letra":"A","tom":"humilde","texto":"Têm razão em estar zangados. Pedimos desculpa e prometemos trabalhar mais.","efeitos":{"AD":2,"EQ":-1}},{"letra":"B","tom":"equilibrada","texto":"Perdemos um jogo, não uma guerra. A época continua e vamos recuperar.","efeitos":{"IM":1}},{"letra":"C","tom":"provocadora","texto":"Os adeptos que vêm cá sabem que o clube é maior do que um resultado.","efeitos":{"AD":-1}}],"variaveis":[]},{"id":"IMP-023","titulo":"Empate com polémica de arbitragem","seccao":"Depois de derrotas e empates","quando":"golo anulado ou penálti polémico num empate ou derrota","modo":"AMBOS","jornalista":"imprensa desportiva","tipoJornalista":"desportiva","pergunta":"O árbitro anulou um golo qu ó um número, e os números não correm. Os jogadores sim.","efeitos":{"IM":1,"AD":1}}],"variaveis":["idade"]},{"id":"IMP-031","titulo":"Voto de confiança","seccao":"Treinador","quando":"pressão sobre o treinador (3 jogos sem vencer e rumores de despedimento)","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"Garante que o {treinador} continua?","respostas":[{"letra":"A","tom":"garantia","texto":"Garanto. Tem a nossa confiança total.","efeitos":{"TR":2,"EQ":1,"AD":-1},"promessa":"manter o treinador; se despedir nos próximos 30 dias: MENTIRA, DN −2, IM −2, BL −1","mentira":"se despedir nos próximos 30 dias: MENTIRA, DN −2, IM −2, BL −1"},{"letra":"B","tom":"prudente","texto":"Não faço garantias. Avaliamos o trabalho em cada momento.","efeitos":{"TR":-1,"EQ":-1,"IM":1}},{"letra":"C","tom":"firme","texto":"Ninguém tem a vida garantida no futebol. Nem ele, nem eu.","efeitos":{"TR":-1,"DN":1}}],"variaveis":["treinador"]},{"id":"IMP-032","titulo":"Despedimento do treinador","seccao":"Treinador","quando":"despedimento do treinador","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"Despediu o {treinador}. Como justifica a decisão?","respostas":[{"letra":"A","tom":"respeitosa","texto":"É uma decisão difícil. Agradeço-lhe o trabalho, mas era preciso mudar o rumo.","efeitos":{"IM":1,"TR":1},"notas":"(reputação junto de outros treinadores)"},{"letra":"B","tom":"directa","texto":"Os resultados falaram. O clube precisa de resultados, e foi essa a razão.","efeitos":{"AD":1,"DN":1,"TR":-1},"notas":"(reputação)"},{"letra":"C","tom":"reservada","texto":"Prefiro não entrar em pormenores. É uma decisão interna.","efeitos":{"IM":-1}}],"variaveis":["treinador"]},{"id":"IMP-033","titulo":"Apresentação do novo treinador","seccao":"Treinador","quando":"contratação de novo treinador","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"Porquê o {treinador}? Que perfil procuravam?","respostas":[{"letra":"A","tom":"filosofia","texto":"Procurávamos um treinador que se alinhasse com a nossa filosofia, e ele encaixa perfeitamente.","efeitos":{"AD":1,"DN":1,"TR":1}},{"letra":"B","tom":"resultados","texto":"Procurávamos resultados. E os resultados do {treinador} falam por si.","efeitos":{"AD":1,"IM":1}},{"letra":"C","tom":"honesta","texto":"Era a opção possível dentro do nosso orçamento, e estamos confiantes.","efeitos":{"AD":-1,"TR":-1,"DN":1}}],"variaveis":["treinador"]},{"id":"IMP-034","titulo":"Conflito de filosofia","seccao":"Treinador","quando":"filosofia do clube (ex.: jovens) contraria o estilo do treinador","modo":"AMBOS","jornalista":"imprensa desportiva","tipoJornalista":"desportiva","pergunta":"Corre que o treinador não quer apostar nos jovens, ao contrário do que o clube defende. Há tensão?","respostas":[{"letra":"A","tom":"negar","texto":"Nenhuma. Estamos todos alinhados.","efeitos":{"TR":1,"IM":-1},"mentira":"MENTIRA se a tensão for pública","notas":"MENTIRA se a tensão for pública"},{"letra":"B","tom":"reconhecer","texto":"Há debate saudável. Mas o rumo é do clube, e ele vai cumpri-lo.","efeitos":{"TR":-1,"DN":1,"AD":1}},{"letra":"C","tom":"dividir","texto":"Discordamos em algumas coisas, mas respeitamo-nos. Vamos chegar a um meio-termo.","efeitos":{"IM":1}}],"variaveis":[]},{"id":"IMP-035","titulo":"Renovação do treinador","seccao":"Treinador","quando":"treinador com bons resultados e contrato a terminar","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"O contrato do {treinador} acaba no fim da época. Vão renovar?","respostas":[{"letra":"A","tom":"comprometida","texto":"Quero renovar e já estamos em conversas. É uma peça fundamental.","efeitos":{"TR":2,"AD":1,"EQ":1}},{"letra":"B","tom":"cautelosa","texto":"Há tempo para tudo. Primeiro, concentração na época.","efeitos":{}},{"letra":"C","tom":"negociadora","texto":"Quem tem sucesso aumenta o seu preço. Veremos o que o clube pode oferecer.","efeitos":{"TR":-1,"DN":1}}],"variaveis":["treinador"]},{"id":"IMP-036","titulo":"Dívida elevada","seccao":"Finanças, dono e fair play","quando":"dívida acima de um limiar (config)","modo":"AMBOS","jornalista":"imprensa económica","tipoJornalista":"economica","pergunta":"A dívida do clube cresceu. Qual é o plano para a reduzir?","respostas":[{"letra":"A","tom":"transparente","texto":"Temos um plano de amortização e vamos publicar os números. A dívida é gerível.","efeitos":{"AD":1,"DN":1,"IM":1},"promessa":"reduzir a dívida"},{"letra":"B","tom":"minimizando","texto":"A dívida está dentro do normal para um clube do nosso tamanho. Não há motivo para alarme.","efeitos":{"IM":-1},"mentira":"MENTIRA se o estado financeiro for \"crise\"","notas":"MENTIRA se o estado financeiro for \"crise\""},{"letra":"C","tom":"ofensiva","texto":"A dívida é consequência de más gestões passadas. Estou a resolver o que me deixaram.","efeitos":{"DN":-1,"AD":1},"notas":"(se o dono anterior era impopular)"}],"variaveis":[]},{"id":"IMP-037","titulo":"Sanção de fair play","seccao":"Finanças, dono e fair play","quando":"o clube é sancionado por fair play financeiro","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"O clube foi sancionado por violar o fair play. Como é que isto aconteceu?","respostas":[{"letra":"A","tom":"assumindo","texto":"Assumimos o erro e vamos cumprir a sanção. Já ajustámos a política salarial.","efeitos":{"DN":1,"IM":1}},{"letra":"B","tom":"contestando","texto":"Discordamos da leitura das regras e vamos recorrer.","efeitos":{"AD":1,"IM":-1}},{"letra":"C","tom":"relativizando","texto":"Todos os clubes grandes são multados. É o preço de competir.","efeitos":{"AD":1,"DN":-1,"IM":-1}}],"variaveis":[]},{"id":"IMP-038","titulo":"Injecção de capital do dono","seccao":"Finanças, dono e fair play","quando":"o dono injectou capital ou emprestou dinheiro ao clube","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"O dono voltou a pôr dinheiro no clube. É sustentável depender dele?","respostas":[{"letra":"A","tom":"agradecida","texto":"O dono acredita no projecto, e é graças a ele que temos condições. Mas queremos ser autossustentáveis.","efeitos":{"DN":2,"AD":1}},{"letra":"B","tom":"realista","texto":"Não é o ideal. Estamos a trabalhar para equilibrar receitas e despesas.","efeitos":{"DN":-1,"IM":1}},{"letra":"C","tom":"evasiva","texto":"Não comento negócios entre accionistas.","efeitos":{"IM":-1}}],"variaveis":[]},{"id":"IMP-039","titulo":"Rumores de venda do clube","seccao":"Finanças, dono e fair play","quando":"modo DONO com satisfação dos adeptos baixa (crise) ou investidor interessado","modo":"DONO","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"Corre que investidores estão interessados em comprar o clube. Está disposto a vender?","respostas":[{"letra":"A","tom":"firme","texto":"O clube não está à venda. Quero continuar o projecto.","efeitos":{"AD":2,"DN":-1},"promessa":"não vender nesta época; se vender: MENTIRA, AD −3","mentira":"se vender: MENTIRA, AD −3"},{"letra":"B","tom":"aberta","texto":"Se aparecer uma proposta boa para o clube, eu ouço. Mas não vendo por vender.","efeitos":{"IM":1}},{"letra":"C","tom":"ambígua","texto":"Neste momento não há nada. O futuro logo se vê.","efeitos":{"AD":-1}}],"variaveis":[]},{"id":"IMP-040","titulo":"Patrocinador a sair","seccao":"Finanças, dono e fair play","quando":"patrocinador principal rescinde ou não renova","modo":"AMBOS","jornalista":"imprensa económica","tipoJornalista":"economica","pergunta":"O principal patrocinador abandona o clube. Isso é um sinal de crise?","respostas":[{"letra":"A","tom":"calma","texto":"Não. Há muito interesse de outras marcas, e vamos encontrar uma solução.","efeitos":{"DN":1,"IM":1}},{"letra":"B","tom":"honesta","texto":"É um golpe, não nego. Mas o clube é maior do que um patrocinador.","efeitos":{"AD":1,"IM":1}},{"letra":"C","tom":"recriminadora","texto":"Quem sai agora não merece voltar. Os adeptos sabem quem esteve ao nosso lado.","efeitos":{"AD":1,"IM":-1}}],"variaveis":[]},{"id":"IMP-041","titulo":"Resultados financeiros anuais","seccao":"Finanças, dono e fair play","quando":"fecho do ano financeiro","modo":"AMBOS","jornalista":"imprensa económica","tipoJornalista":"economica","pergunta":"As contas anuais saíram. {clube} teve {lucro_ou_prejuizo}. Como as analisa?","respostas":[{"letra":"A","tom":"satisfeita","texto":"Estamos no caminho certo. Os resultados reflectem a disciplina da gestão.","efeitos":{"DN":1,"IM":1}},{"letra":"B","tom":"autocrítica","texto":"Podíamos ter feito melhor, e vamos corrigir. A sustentabilidade é uma prioridade.","efeitos":{"DN":1,"AD":1}},{"letra":"C","tom":"distraída","texto":"As contas são só um instrumento. O que conta é o que acontece em campo.","efeitos":{"IM":-1,"DN":-1}}],"variaveis":["clube","lucro_ou_prejuizo"]},{"id":"IMP-042","titulo":"Lesão grave de uma estrela","seccao":"Jogadores, balneário e academia","quando":"lesão grave (acima de 3 meses) de um titular importante","modo":"AMBOS","jornalista":"imprensa desportiva","tipoJornalista":"desportiva","pergunta":"A lesão do {jogador} é um golpe. Como vai compensar a ausência?","respostas":[{"letra":"A","tom":"confiante","texto":"Temos um grupo forte, e outros vão assumir esse papel. Vamos suportar a ausência.","efeitos":{"EQ":1,"BL":1}},{"letra":"B","tom":"realista","texto":"É uma perda enorme, e não vamos encontrar um substituto igual. Vamos olhar para o mercado.","efeitos":{"IM":1}},{"letra":"C","tom":"solidária","texto":"O {jogador} vai ter todo o apoio do clube durante a recuperação. Está em primeiro lugar.","efeitos":{"EQ":1,"BL":2}}],"variaveis":["jogador"]},{"id":"IMP-043","titulo":"Jogador descontente","seccao":"Jogadores, balneário e academia","quando":"jogador titular ou ex-titular com moral baixa, pediu para sair","modo":"AMBOS","jornalista":"imprensa desportiva","tipoJornalista":"desportiva","pergunta":"O {jogador} não está feliz e quer sair. O que vai fazer?","respostas":[{"letra":"A","tom":"firme","texto":"Tem contrato e vai cumpri-lo. Aqui não se trocam jogadores por birras.","efeitos":{"AD":1,"BL":-1,"EQ":-1,"DN":1},"notas":"Jogador mantém-se descontente (moral continua baixa)"},{"letra":"B","tom":"dialogante","texto":"Vamos falar com ele e perceber os motivos. Todos têm direito a ser ouvidos.","efeitos":{"BL":1,"EQ":1}},{"letra":"C","tom":"aberta","texto":"Se for o desejo dele e a proposta for justa, avaliamos a saída.","efeitos":{"BL":1,"AD":-1,"DN":1},"notas":"(do jogador),  . Abre a porta a negociações"}],"variaveis":["jogador"]},{"id":"IMP-044","titulo":"Promoção de um jovem da academia","seccao":"Jogadores, balneário e academia","quando":"jovem sub-18 ou sub-21 promovido à equipa principal com bom rendimento","modo":"AMBOS","jornalista":"blogue de adeptos","tipoJornalista":"blogue","pergunta":"O {jovem} brilhou. A academia vai ser a base do futuro do clube?","respostas":[{"letra":"A","tom":"orgulhosa","texto":"A academia é o nosso orgulho. Vamos continuar a investir nela e a dar oportunidades.","efeitos":{"AD":2,"DN":1,"BL":1}},{"letra":"B","tom":"cuidadosa","texto":"É cedo para o dizer. O {jovem} tem talento, mas tem de continuar a crescer.","efeitos":{"IM":1}},{"letra":"C","tom":"comercial","texto":"Um jovem que brilha também atrai olhares. Estamos atentos ao valor de mercado.","efeitos":{"AD":-1,"DN":1}}],"variaveis":["jovem"]},{"id":"IMP-045","titulo":"Indisciplina","seccao":"Jogadores, balneário e academia","quando":"jogador expulso ou com polémica fora de campo","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"O {jogador} foi expulso/envolveu-se em polémica. Que medidas vão tomar?","respostas":[{"letra":"A","tom":"rigorosa","texto":"Haverá sanção interna. Ninguém está acima do clube.","efeitos":{"BL":-1,"EQ":-1,"AD":1,"DN":1}},{"letra":"B","tom":"compreensiva","texto":"Foi um deslize isolado e vamos falar com ele. Conhecemos o carácter do jogador.","efeitos":{"BL":1,"IM":-1}},{"letra":"C","tom":"silenciosa","texto":"Assuntos internos tratam-se internamente. Não vou comentar mais.","efeitos":{"IM":-1}}],"variaveis":["jogador"]},{"id":"IMP-046","titulo":"Capitão e liderança","seccao":"Jogadores, balneário e academia","quando":"o {capitao} tem moral baixa ou forma má","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"O capitão {capitao} tem estado abaixo do esperado. Mantém-lhe a braçadeira?","respostas":[{"letra":"A","tom":"confiante","texto":"Mantenho. A liderança não se mede só pelos golos, e ele continua a ser uma referência.","efeitos":{"BL":1,"EQ":1}},{"letra":"B","tom":"exigente","texto":"A braçadeira exige exemplo. Se não melhorar, teremos de reavaliar.","efeitos":{"EQ":-1,"BL":-1}},{"letra":"C","tom":"protectora","texto":"Os jogadores passam por fases, e o capitão tem todo o meu apoio.","efeitos":{"BL":1,"AD":-1}}],"variaveis":["capitao"]},{"id":"IMP-047","titulo":"Cláusula de rescisão","seccao":"Jogadores, balneário e academia","quando":"jogador com cláusula de rescisão activada por outro clube","modo":"AMBOS","jornalista":"imprensa desportiva","tipoJornalista":"desportiva","pergunta":"O {adversario} pagou a cláusula de rescisão do {jogador}. Estão impotentes?","respostas":[{"letra":"A","tom":"resignada","texto":"A cláusula existe para isto. É um direito do jogador, e vamos usar o dinheiro de forma inteligente.","efeitos":{"DN":1,"AD":-1}},{"letra":"B","tom":"queixosa","texto":"É um valor muito abaixo do que ele vale. Foi um erro negociá-la naquele patamar.","efeitos":{"AD":-1,"DN":-1,"IM":1}},{"letra":"C","tom":"orgulhosa","texto":"Formámos um jogador que vale tanto dinheiro. Isso é uma vitória do clube.","efeitos":{"AD":1,"DN":1}}],"variaveis":["adversario","jogador"]},{"id":"IMP-048","titulo":"Preço dos bilhetes","seccao":"Adeptos, estádio e infraestruturas","quando":"o clube subiu os preços dos bilhetes ou das quotas","modo":"AMBOS","jornalista":"blogue de adeptos","tipoJornalista":"blogue","pergunta":"Os bilhetes subiram. Os adeptos já pagam muito. Isso é justo?","respostas":[{"letra":"A","tom":"justificando","texto":"Os custos subiram e queremos manter a qualidade do plantel. Acreditamos que vale a pena.","efeitos":{"AD":-2,"DN":1}},{"letra":"B","tom":"compensando","texto":"Percebemos a revolta. Vamos criar descontos para jovens e sócios históricos.","efeitos":{"IM":1}},{"letra":"C","tom":"recuando","texto":"Ouvimos e vamos baixar os preços.","efeitos":{"AD":2,"DN":-1}}],"variaveis":[]},{"id":"IMP-049","titulo":"Protestos dos adeptos","seccao":"Adeptos, estádio e infraestruturas","quando":"modo DONO com satisfação dos adeptos abaixo de 40","modo":"DONO","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"Os adeptos protestaram à porta do estádio. Entende o descontentamento?","respostas":[{"letra":"A","tom":"compreensiva","texto":"Entendo, e peço desculpa pelo sofrimento. Vou ouvir uma delegação de adeptos esta semana.","efeitos":{"AD":2,"DN":1},"promessa":"reunião em 7 dias"},{"letra":"B","tom":"firme","texto":"Entendo, mas protestar à porta não ajuda ninguém. O diálogo é a via.","efeitos":{"AD":-1,"IM":1}},{"letra":"C","tom":"provocadora","texto":"Os adeptos que protestam são uma minoria. A grande maioria apoia-nos.","efeitos":{"AD":-3,"IM":-1}}],"variaveis":[]},{"id":"IMP-050","titulo":"Obras no estádio","seccao":"Adeptos, estádio e infraestruturas","quando":"obra de infraestrutura concluída ou anunciada","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"As obras no {estadio} avançaram. O que vão ganhar os adeptos?","respostas":[{"letra":"A","tom":"entusiasmada","texto":"Mais conforto, mais capacidade e mais ambiente. Vai ser uma casa à altura do clube.","efeitos":{"AD":2,"DN":1}},{"letra":"B","tom":"cautelosa","texto":"As obras trazem incómodos, mas o resultado final compensa. Pedimos paciência.","efeitos":{"IM":1}},{"letra":"C","tom":"comercial","texto":"É também um investimento: mais capacidade significa mais receitas e mais competitividade.","efeitos":{"DN":2,"AD":1}}],"variaveis":["estadio"]},{"id":"IMP-051","titulo":"Estádio vazio","seccao":"Adeptos, estádio e infraestruturas","quando":"ocupação do estádio abaixo de 60% durante três jogos","modo":"AMBOS","jornalista":"imprensa desportiva","tipoJornalista":"desportiva","pergunta":"O estádio está meio vazio. Os adeptos desistiram do clube?","respostas":[{"letra":"A","tom":"compreensiva","texto":"Não desistiram. Estão desiludidos, e é a nós que cabe reconquistá-los com resultados.","efeitos":{"AD":1,"DN":1}},{"letra":"B","tom":"apelativa","texto":"Peço a todos que venham apoiar. Os jogadores precisam do vosso calor.","efeitos":{"AD":1,"EQ":1}},{"letra":"C","tom":"ofendida","texto":"Os adeptos de verdade estão connosco, e os outros não fazem falta.","efeitos":{"AD":-3,"IM":-1}}],"variaveis":[]},{"id":"IMP-052","titulo":"Sorteio continental","seccao":"Competições continentais e selecções","quando":"sorteio da fase de liga ou de eliminatórias","modo":"AMBOS","jornalista":"imprensa nacional","tipoJornalista":"nacional","pergunta":"O sorteio colocou-vos {adversario}. É um sorteio difícil?","respostas":[{"letra":"A","tom":"confiante","texto":"Contra os melhores é que se mede a nossa capacidade. Estamos prontos.","efeitos":{"AD":1,"EQ":1}},{"letra":"B","tom":"realista","texto":"É um sorteio duro. Mas ninguém disse que seria fácil.","efeitos":{"IM":1}},{"letra":"C","tom":"descontraída","texto":"Preferíamos outro, mas não escolhemos. Vamos dar o nosso melhor.","efeitos":{}}],"variaveis":["adversario"]},{"id":"IMP-053","titulo":"Qualificação para a competição europeia","seccao":"Competições continentais e selecções","quando":"o clube garante uma vaga europeia (Champions, Liga Europa ou Conferência)","modo":"AMBOS","jornalista":"imprensa local","tipoJornalista":"local","pergunta":"O clube vai jogar na Europa. Qual é o objectivo na competição?","respostas":[{"letra":"A","tom":"ambiciosa","texto":"Pas // ---------- ilustrações isométricas das infraestruturas (geradas pelo nível e pelo tamanho do clube) ----------
let ISO_ID = 0;
const hexRgb = (h) => { const v = parseInt(h.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; };
const tom = (h, f) => { if (!h.startsWith('#')) return h; const [r, g, b] = hexRgb(h); const c = (x) => Math.max(0, Math.min(255, Math.round(f >= 0 ? x + (255 - x) * f : x * (1 + f)))); return `rgb(${c(r)},${c(g)},${c(b)})`; };
const faces = (h) => [tom(h, 0.12), tom(h, -0.38), tom(h, -0.2)];
function Iso(w, h, esc, ox, oy) {
  const id = `iso${++ISO_ID}`;
  const out = [];
  const P = (x, y, z = 0) => [ox + (x - y) * 0.866 * esc, oy + (x + y) * 0.5 * esc - z * esc];
  const pts = (a) => a.map((q) => P(...q).map((v) => v.toFixed(1)).join(',')).join(' ');
  const defs = `<defs>
    <pattern id="${id}-relva" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#4f7a43"/><circle cx="1" cy="2" r=".7" fill="#5d8a4f"/><circle cx="4" cy="4.5" r=".6" fill="#456d3b"/><circle cx="4.5" cy="1" r=".5" fill="#6a9659"/></pattern>
    <pattern id="${id}-betao" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#9a9c98"/><path d="M0 8L8 0" stroke="#8d8f8b" stroke-width=".6"/><circle cx="2" cy="5" r=".5" fill="#a9aba7"/></pattern>
    <pattern id="${id}-asfalto" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#3e4248"/><circle cx="1.2" cy="1.5" r=".45" fill="#4a4e55"/><circle cx="3.6" cy="3.8" r=".4" fill="#363a40"/></pattern>
    <linearGradient id="${id}-ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22362c"/><stop offset="1" stop-color="#121c17"/></linearGradient>
    <linearGradient id="${id}-vidro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe6f2" stop-opacity=".75"/><stop offset="1" stop-color="#8fb6cc" stop-opacity=".45"/></linearGradient>
    <radialGradient id="${id}-luz" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe0" stop-opacity=".9"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="${id}-copa" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#5f9a55"/><stop offset=".6" stop-color="#2f6b3a"/><stop offset="1" stop-color="#1f4a28"/></radialGradient>
  </defs>`;
  const api = {
    id, P,
    poly: (a, fill, extra = '') => out.push(`<polygon points="${pts(a)}" fill="${fill}" ${extra}/>`),
    plano: (x, y, w, d, z, fill, extra = '') => api.poly([[x, y, z], [x + w, y, z], [x + w, y + d, z], [x, y + d, z]], fill, extra),
    line: (a, b, cor, lw = 1, extra = '') => { const [x1, y1] = P(...a), [x2, y2] = P(...b); out.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${cor}" stroke-width="${lw}" stroke-linecap="round" ${extra}/>`); },
    sombra: (x, y, w, d, h) => { const k = h * 0.7; api.poly([[x, y + d, 0.01], [x + w, y + d, 0.01], [x + w + k, y + d + k * 0.35, 0.01], [x + k, y + d + k * 0.35, 0.01]], 'rgba(0,0,0,.28)'); api.poly([[x + w, y, 0.01], [x + w + k, y + k * 0.35, 0.01], [x + w + k, y + d + k * 0.35, 0.01], [x + w, y + d, 0.01]], 'rgba(0,0,0,.28)'); },
    caixa: (x, y, z, w, d, h, cores, extra = '') => {
      const [topo, esq, dir] = typeof cores === 'string' ? faces(cores) : cores;
      api.poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], esq, extra);
      api.poly([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], dir, extra);
      api.poly([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], topo, extra);
    },
    // Edifício com janelas nas duas fachadas visíveis e equipamento no telhado.
    edificio: (x, y, w, d, andares, cor, janela = '#9fd3f0') => {
      const h = andares * 4.2; api.sombra(x, y, w, d, h); api.caixa(x, y, 0, w, d, h, cor);
      for (let a = 0; a < andares; a++) {
        for (let k = 1.5; k < w - 2; k += 3.4) api.plano(0, 0, 0, 0, 0, 'none') , api.poly([[x + k, y + d + 0.05, a * 4.2 + 1.2], [x + k + 2, y + d + 0.05, a * 4.2 + 1.2], [x + k + 2, y + d + 0.05, a * 4.2 + 3.1], [x + k, y + d + 0.05, a * 4.2 + 3.1]], janela, 'opacity=".85"');
        for (let k = 1.5; k < d - 2; k += 3.4) api.poly([[x + w + 0.05, y + k, a * 4.2 + 1.2], [x + w + 0.05, y + k + 2, a * 4.2 + 1.2], [x + w + 0.05, y + k + 2, a * 4.2 + 3.1], [x + w + 0.05, y + k, a * 4.2 + 3.1]], tom(janela, -0.15), 'opacity=".85"');
      }
      api.caixa(x + 2, y + 2, h, 4, 3, 1.6, '#b9bec6'); if (w > 14) api.caixa(x + w - 7, y + d - 6, h, 4, 4, 1.2, '#a3a9b2');
    },
    relvado: (x, y, w, d, opts = {}) => {
      const n = opts.riscas ?? 12;
      api.plano(x - 3, y - 3, w + 6, d + 6, 0.02, '#3d7a44');
      for (let k = 0; k < n; k++) api.poly([[x + (w * k) / n, y, 0.04], [x + (w * (k + 1)) / n, y, 0.04], [x + (w * (k + 1)) / n, y + d, 0.04], [x + (w * k) / n, y + d, 0.04]], k % 2 ? '#47a052' : '#53b05d');
      // Corte cruzado (xadrez subtil).
      const m = Math.max(3, Math.round(n * d / w));
      for (let k = 0; k < m; k += 2) api.poly([[x, y + (d * k) / m, 0.05], [x + w, y + (d * k) / m, 0.05], [x + w, y + (d * (k + 1)) / m, 0.05], [x, y + (d * (k + 1)) / m, 0.05]], 'rgba(255,255,255,.05)');
      const L = (a, b) => api.line([a[0], a[1], 0.1], [b[0], b[1], 0.1], 'rgba(255,255,255,.92)', 0.8);
      const r = (x0, y0, x1, y1) => { L([x0, y0], [x1, y0]); L([x1, y0], [x1, y1]); L([x1, y1], [x0, y1]); L([x0, y1], [x0, y0]); };
      const mg = 1.5;
      r(x + mg, y + mg, x + w - mg, y + d - mg); L([x + w / 2, y + mg], [x + w / 2, y + d - mg]);
      const pa = Math.min(16, w * 0.16), pl = d * 0.58, pq = pa * 0.38, ql = d * 0.28;
      r(x + mg, y + (d - pl) / 2, x + mg + pa, y + (d + pl) / 2); r(x + w - mg - pa, y + (d - pl) / 2, x + w - mg, y + (d + pl) / 2);
      r(x + mg, y + (d - ql) / 2, x + mg + pq, y + (d + ql) / 2); r(x + w - mg - pq, y + (d - ql) / 2, x + w - mg, y + (d + ql) / 2);
      const c = []; for (let k = 0; k <= 28; k++) { const a = (k / 28) * Math.PI * 2; c.push([x + w / 2 + Math.cos(a) * d * 0.13, y + d / 2 + Math.sin(a) * d * 0.13, 0.1]); }
      out.push(`<polyline points="${pts(c)}" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="0.8"/>`);
      // Balizas.
      for (const gx of [x + mg, x + w - mg]) { const g0 = y + d / 2 - 3.6, g1 = y + d / 2 + 3.6; api.line([gx, g0, 0], [gx, g0, 2.4], '#fff', 0.9); api.line([gx, g1, 0], [gx, g1, 2.4], '#fff', 0.9); api.line([gx, g0, 2.4], [gx, g1, 2.4], '#fff', 0.9); }
      if (opts.publicidade) { const cor = opts.publicidade; api.caixa(x - 2.4, y + d + 1.2, 0, w + 4.8, 0.4, 1.3, [cor, tom(cor, -0.1), tom(cor, -0.2)]); api.caixa(x + w + 1.2, y - 2.4, 0, 0.4, d + 4.8, 1.3, ['#eceff3', '#c9ced6', '#dfe3e8']); api.caixa(x - 2.4, y - 2.4, 0, w + 4.8, 0.4, 1.3, ['#eceff3', '#c9ced6', '#dfe3e8']); }
      if (opts.bancos) { api.caixa(x + w / 2 - 12, y + d + 2.5, 0, 6, 1.6, 1.6, '#3a4250'); api.caixa(x + w / 2 + 6, y + d + 2.5, 0, 6, 1.6, 1.6, '#3a4250'); }
    },
    // Bancada em degraus com filas de cadeiras, corredores de acesso e faixa na cor do clube.
    bancada: (x, y, w, d, h, cor, coberta, eixo, frente = true) => {
      const passos = Math.max(3, Math.round(h / 1.6));
      api.sombra(x, y, w, d, h * 0.4);
      for (let k = 0; k < passos; k++) {
        const f = frente ? k / passos : 1 - (k + 1) / passos, hh = h * (frente ? 1 - f : f + 1 / passos);
        const banda = k % 5 === 2 ? '#e9ecf0' : k % 2 ? cor : tom(cor, 0.12);
        const c3 = [banda, tom(banda.startsWith('#') ? banda : cor, -0.42), tom(banda.startsWith('#') ? banda : cor, -0.3)];
        if (eixo === 'x') api.caixa(x, y + d * f, 0, w, d / passos, hh, c3); else api.caixa(x + w * f, y, 0, w / passos, d, hh, c3);
      }
      // Corredores de acesso (vomitórios): linhas escuras perpendiculares às filas.
      const nv = Math.max(2, Math.round((eixo === 'x' ? w : d) / 16));
      const [ha, hb] = frente ? [h + 0.1, 0.6] : [0.6, h + 0.1];
      for (let v = 1; v < nv; v++) { const t = v / nv; if (eixo === 'x') api.line([x + w * t, y, ha], [x + w * t, y + d, hb], 'rgba(20,22,26,.75)', 1.1); else api.line([x, y + d * t, ha], [x + w, y + d * t, hb], 'rgba(20,22,26,.75)', 1.1); }
      if (coberta) {
        api.poly([[x - 1, y - 1, h + 5], [x + w + 1, y - 1, h + 5], [x + w + 1, y + d + 1, h + 5], [x - 1, y + d + 1, h + 5]], `url(#${id}-vidro)`);
        const nr = Math.max(3, Math.round((eixo === 'x' ? w : d) / 8));
        for (let v = 0; v <= nr; v++) { const t = v / nr; if (eixo === 'x') api.line([x + w * t, y - 1, h + 5.05], [x + w * t, y + d + 1, h + 5.05], 'rgba(235,238,242,.9)', 0.7); else api.line([x - 1, y + d * t, h + 5.05], [x + w + 1, y + d * t, h + 5.05], 'rgba(235,238,242,.9)', 0.7); }
        api.line([x - 1, y + d + 1, h + 5], [x + w + 1, y + d + 1, h + 5], '#f2f4f6', 1);
      }
    },

    Juniores: [...sub21, ...sub18].map((p) => ({ id: 'jr:' + p.nome, nome: p.nome, pais: p.pais ?? 'POR', idade: p.idade, pos: p.pos, rot: `${p.pos} · ${p.idade} anos`, kit: kitClube(p.n) })),
    Staff: staff.map((x) => { const [n, i] = x.split('|'); return { id: 's:' + n, nome: n, pais: 'POR', idade: +i, staff: true, rot: `${i} anos`, kit: { fato: true } }; }),
    'Outros clubes': LISTADOS.slice(0, 30).map((x, i) => ({ id: 'm:' + x.nome, nome: x.nome, pais: ['ESP', 'BRA', 'NGA', 'ENG', 'ARG', 'NED'][i % 6], idade: x.idade ?? 24, pos: x.pos, rot: `${x.pos} · ${x.clube}`, kit: { c1: '#3a4458', c2: '#e8e8ea', padrao: 'liso' } })),
  };
}
function editorAvatares() {
  const grupos = pessoasEditor(), lista = grupos[edGrupo].filter((x) => x.nome.toLowerCase().includes(edPesq.toLowerCase()));
  const sel = Object.values(grupos).flat().find((x) => x.id === edSel) ?? lista[0];
  edSel = sel?.id;
  const t = sel ? avTracos(sel) : null, editado = sel && avEdit[sel.id];
  const val = (k) => k === 'pele' ? `<i class="ed-cor" style="background:${AV.pele[t.pele]}"></i>${t.pele + 1}` : k === 'corCabelo' ? `<i class="ed-cor" style="background:${AV.corCabelo[t.corCabelo]}"></i>${AV.rot.corCabelo[t.corCabelo]}` : k === 'corOlhos' ? `<i class="ed-cor" style="background:${AV.corOlhos[t.corOlhos]}"></i>${AV.rot.corOlhos[t.corOlhos]}` : AV.rot[k] ? AV.rot[k][t[k]] : `Tipo ${t[k] + 1}`;
  return `<h2>Editor de avatares <span class="rot">(opcional)</span></h2>
    <div class="ed"><div class="ed-lista"><div class="seg ed-grupos" role="group">${Object.keys(grupos).map((g) => `<button data-edg="${g}" class="${g === edGrupo ? 'on' : ''}">${g}</button>`).join('')}</div>
      <input id="ed-pesq" type="search" placeholder="Pesquisar…" value="${edPesq}" aria-label="Pesquisar pessoa">
      <div class="ed-itens">${lista.map((x) => `<button class="ed-item ${x.id === edSel ? 'on' : ''}" data-eds="${x.id}">${avatarSvg(x, { tam: 34, kit: x.kit })}<span><b>${x.nome}</b><small>${x.rot}${avEdit[x.id] ? ' · editado' : ''}</small></span></button>`).join('')}</div></div>
    ${sel ? `<div class="ed-prev"><div class="ed-av">${avatarSvg(sel, { tam: 150, kit: sel.kit })}</div><b>${sel.nome}</b><small class="rot">${sel.rot}${editado ? ' · editado' : ''}</small>
      <div class="ed-tracos">${Object.keys(AV.max).map((k) => `<div class="ed-t"><button class="ed-s" data-edt="${k}:-1" aria-label="${AV.nomes[k]} anterior">‹</button><span><small>${AV.nomes[k]}</small><b>${val(k)}</b></span><button class="ed-s" data-edt="${k}:1" aria-label="${AV.nomes[k]} seguinte">›</button></div>`).join('')}</div>
      <div class="ed-acoes"><button class="btn" id="ed-aleat">Aleatório</button><button class="btn" id="ed-repor" ${editado ? '' : 'disabled'}>Repor</button></div></div>` : ''}</div>
    <div class="rot">As alterações ficam guardadas neste aparelho e valem para todas as carreiras novas. Os jovens que entrarem na academia recebem o seu próprio avatar.</div>
    <div class="en-nav"><button class="btn" id="en-voltar">‹ Voltar</button><button class="btn prim" id="en-fim">Começar a carreira</button></div>`;
}
function ligarEditor(el, redesenhar) {
  const sel = () => Object.values(pessoasEditor()).flat().find((x) => x.id === edSel);
  el.querySelectorAll('[data-edg]').forEach((b) => b.addEventListener('click', () => { edGrupo = b.dataset.edg; edSel = null; redesenhar(); }));
  el.querySelectorAll('[data-eds]').forEach((b) => b.addEventListener('click', () => { edSel = b.dataset.eds; redesenhar(); }));
  const q = el.querySelector('#ed-pesq'); if (q) q.addEventListener('input', () => { edPesq = q.value; const pos = q.selectionStart; redesenhar(); const n = document.getElementById('ed-pesq'); n.focus(); n.setSelectionRange(pos, pos); });
  el.querySelectorAll('[data-edt]').forEach((b) => b.addEventListener('click', () => { const p = sel(); if (!p) return; const [k, d] = b.dataset.edt.split(':'); const t = avTracos(p); avEdit[p.id] = { ...(avEdit[p.id] ?? {}), [k]: (t[k] + +d + AV.max[k]) % AV.max[k] }; avGravar(); redesenhar(); }));
  el.querySelector('#ed-aleat')?.addEventListener('click', () => { const p = sel(); const r = avRng(Date.now() >>> 0); avEdit[p.id] = Object.fromEntries(Object.keys(AV.max).map((k) => [k, k === 'oculos' && !p.staff ? 0 : Math.floor(r() * AV.max[k])])); avGravar(); redesenhar(); });
  el.querySelector('#ed-repor')?.addEventListener('click', () => { delete avEdit[edSel]; avGravar(); redesenhar(); });
}

// ---------- Guardar ----------
// A gravação é automática (cada dia avançado, por perfil); o botão força uma gravação e confirma. Na app: IndexedDB, no worker.
function guardarProgresso(avisar) {
  const quando = new Date();
  if (PERFIL_ACTIVO) { PERFIL_ACTIVO.dataJogo = fmtData(hoje); PERFIL_ACTIVO.gravadoEm = quando.toISOString(); gravarPerfil(PERFIL_ACTIVO.conta, PERFIL_ACTIVO); }
  if (!avisar) return;
  let t = document.getElementById('aviso-gravar'); if (!t) { t = document.createElement('div'); t.id = 'aviso-gravar'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.innerHTML = `<b>Progresso guardado</b><span>${fmtData(hoje)} · ${quando.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' })}${PERFIL_ACTIVO ? ` · perfil de ${PERFIL_ACTIVO.nome.split(' ')[0]}` : ''}</span><small>A gravação automática continua activa.</small>`;
  t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600);
}

// ---------- Ecrã de carregamento (intro) ----------
// Na app, as etapas e a percentagem vêm do worker (mundo, gravação, motor); no protótipo são simuladas (~2,5 s).
(function intro() {
  const DICAS = [
    'As promessas à imprensa ficam registadas e têm prazo.',
    'Um jovem titular evolui mais depressa, sobretudo numa liga forte.',
    'Subir o preço do bilhete enche menos o estádio e baixa a satisfação dos adeptos.',
    'A janela de mercado aparece no calendário com o ícone 🔁.',
    'Os finalistas dos prémios são anunciados a 16 de Julho; a cerimónia é a 30.',
  ];
  const ETAPAS = [['A carregar o mundo…', 35], ['A ler a gravação…', 60], ['A preparar a época…', 85], ['A abrir o clube…', 100]];
  const el = document.createElement('div');
  el.id = 'intro'; el.setAttribute('role', 'status'); el.setAttribute('aria-label', 'A carregar o FutCEO');
  el.innerHTML = `<img src="intro.jpg" alt=""><div class="in-topo"><div class="in-logo">FutCEO</div><div class="in-sub">Gestão de futebol</div></div>
    <div class="in-baixo"><div class="in-etapa">A iniciar…</div><div class="in-barra"><i></i></div><div class="in-dica">${DICAS[Math.floor(Math.random() * DICAS.length)]}</div><div class="in-saltar">Toca para continuar</div></div>`;
  document.body.appendChild(el);
  const fechar = () => { el.classList.add('fora'); setTimeout(() => el.remove(), 500); };
  el.addEventListener('click', fechar);
  let k = 0;
  const passo = () => {
    if (!document.body.contains(el)) return;
    if (k >= ETAPAS.length) { setTimeout(fechar, 350); return; }
    const [txt, pct] = ETAPAS[k++];
    el.querySelector('.in-etapa').textContent = txt; el.querySelector('.in-barra i').style.width = pct + '%';
    setTimeout(passo, 600);
  };
  setTimeout(passo, 150);
})();
</script>
